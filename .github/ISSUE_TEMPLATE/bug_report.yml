name: Bug report
description: Report a reproducible defect with evidence.
title: "[BUG] "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and evidence
      description: Exact steps, workflow run IDs, logs, hashes, device/build details. Redact secrets.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security hygiene
      options:
        - label: I did not include passwords, access tokens, private keys, keystores, or other secrets.
          required: true
