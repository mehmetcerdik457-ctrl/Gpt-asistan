name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Python test checkout is exact PR HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "KRAL_PYTHON_EXACT_HEAD=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - name: Test owner authentication, memory, and provider contract
        run: |
          set -o pipefail
          python -m unittest discover -s server/tests -v 2>&1 | tee python-tests.log
      - name: Upload Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-python-tests
          path: python-tests.log
          if-no-files-found: error
