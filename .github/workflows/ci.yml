name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - name: Test candidate artifact identity checks
        run: |
          set -o pipefail
          python -m unittest discover -s scripts/tests -v 2>&1 | tee artifact-tests.log
      - name: Test owner authentication, memory, and provider contract
        run: |
          set -o pipefail
          python -m unittest discover -s server/tests -v 2>&1 | tee python-tests.log
      - name: Upload Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-python-tests
          path: |
            python-tests.log
            artifact-tests.log
          if-no-files-found: error
