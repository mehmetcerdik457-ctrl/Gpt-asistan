name: Dependency Submission

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Probe dependency graph feature state
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          code=$(curl -sS -o /tmp/dependency-sbom.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")
          echo "DEPENDENCY_GRAPH_HTTP=${code}" | tee dependency-evidence/state.txt
          case "$code" in
            200)
              echo 'DEPENDENCY_GRAPH=ENABLED' | tee -a dependency-evidence/state.txt
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'DEPENDENCY_GRAPH=USER_ACTION_REQUIRED REASON=FEATURE_DISABLED' | tee -a dependency-evidence/state.txt
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            403)
              echo 'DEPENDENCY_GRAPH=USER_ACTION_REQUIRED REASON=API_PERMISSION' | tee -a dependency-evidence/state.txt
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "DEPENDENCY_GRAPH=BLOCKED REASON=UNEXPECTED_HTTP_${code}" | tee -a dependency-evidence/state.txt
              exit 1
              ;;
          esac

      - name: Checkout exact PR base for differential baseline
        if: github.event_name == 'pull_request' && steps.graph.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependency-base
          persist-credentials: false

      - name: Bootstrap exact PR base dependency resolution
        if: github.event_name == 'pull_request' && steps.graph.outputs.enabled == 'true'
        id: base
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_sha="$(git -C dependency-base rev-parse HEAD)"
          echo "DEPENDENCY_REVIEW_BASE_SHA=${base_sha}" | tee -a dependency-evidence/state.txt
          test "${base_sha}" = "${EXPECTED_BASE_SHA}"
          if ! grep -q '^pluginManagement' dependency-base/settings.gradle.kts; then
            tmp="$(mktemp)"
            cat > "${tmp}" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          EOF
            cat dependency-base/settings.gradle.kts >> "${tmp}"
            mv "${tmp}" dependency-base/settings.gradle.kts
            echo 'DEPENDENCY_REVIEW_BASE_BOOTSTRAP=RESOLUTION_REPOSITORIES_ONLY' | tee -a dependency-evidence/state.txt
          else
            echo 'DEPENDENCY_REVIEW_BASE_BOOTSTRAP=NOT_REQUIRED' | tee -a dependency-evidence/state.txt
          fi
          echo "sha=${base_sha}" >> "$GITHUB_OUTPUT"

      - name: Submit exact PR base dependency snapshot
        if: github.event_name == 'pull_request' && steps.graph.outputs.enabled == 'true'
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        env:
          GITHUB_DEPENDENCY_GRAPH_REF: refs/heads/${{ github.base_ref }}
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ steps.base.outputs.sha }}
        with:
          build-root-directory: dependency-base
          gradle-version: '8.7'
          cache-provider: basic
          dependency-graph: generate-and-submit

      - name: Generate and submit current dependency graph
        if: steps.graph.outputs.enabled == 'true'
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.7'
          cache-provider: basic
          dependency-graph: generate-and-submit

      - name: Preserve dependency graph state evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-graph-state-${{ github.sha }}
          path: dependency-evidence/state.txt
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review the submitted dependency diff
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180
