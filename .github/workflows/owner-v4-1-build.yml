name: MEHMET OWNER V4.1 isolated Android build

on:
  push:
    branches:
      - owner-v4-1-build-evidence-20260929
    paths:
      - 'owner_v4_1/**'
      - '.github/workflows/owner-v4-1-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ZIP: owner_v4_1/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE_CANDIDATE.zip
      EXPECTED_SOURCE_SHA256: 7df6d150b9159affe69e529fdf1ada3ce8f957ffb1c99ba7c55f8fe3eefd7628
      EXPECTED_WRAPPER_SHA256: 498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17
      EXPECTED_GRADLE_DIST_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          java -version
          gradle --version
          sdkmanager --version

      - name: Verify source archive and unpack
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${SOURCE_ZIP}" | awk '{print $1}')" = "${EXPECTED_SOURCE_SHA256}"
          rm -rf owner_v4_1/work
          mkdir -p owner_v4_1/work
          unzip -q "${SOURCE_ZIP}" -d owner_v4_1/work
          cd owner_v4_1/work/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE
          unzip -t "../../../${SOURCE_ZIP}" > /tmp/source_zip_test.txt
          if [ -f SOURCE_TREE_MANIFEST.sha256 ]; then
            sha256sum -c SOURCE_TREE_MANIFEST.sha256
          fi

      - name: Source tests
        shell: bash
        run: |
          set -euo pipefail
          cd owner_v4_1/work/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE
          python3 tests/source_lexical_test.py
          python3 tests/source_security_invariant_test.py
          bash tests/run_pure_java_tests.sh

      - name: Generate and verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd owner_v4_1/work/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          test -f gradle/wrapper/gradle-wrapper.jar
          ACTUAL="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          echo "WRAPPER_SHA256=${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED_WRAPPER_SHA256}"
          grep -F "distributionSha256Sum=${EXPECTED_GRADLE_DIST_SHA256}" gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Clean compile assemble release
        shell: bash
        run: |
          set -euo pipefail
          cd owner_v4_1/work/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE
          ./gradlew clean :core:assembleRelease :bridge:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Binary and merged-manifest verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/owner_v4_1/work/MEHMET_OWNER_V4_1_CONTROL_PLANE_SOURCE"
          BT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"
          CORE="${ROOT}/core/build/outputs/apk/release/core-release-unsigned.apk"
          BRIDGE="${ROOT}/bridge/build/outputs/apk/release/bridge-release-unsigned.apk"
          test -f "${CORE}"
          test -f "${BRIDGE}"
          mkdir -p "$GITHUB_WORKSPACE/owner_v4_1/out"
          cp "${CORE}" "$GITHUB_WORKSPACE/owner_v4_1/out/MEHMET_OWNER_V4_1_CORE_UNSIGNED.apk"
          cp "${BRIDGE}" "$GITHUB_WORKSPACE/owner_v4_1/out/MEHMET_OWNER_V4_1_BRIDGE_UNSIGNED.apk"
          unzip -t "${CORE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/core_zip_test.txt"
          unzip -t "${BRIDGE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_zip_test.txt"
          "${BT}/aapt2" dump badging "${CORE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/core_badging.txt"
          "${BT}/aapt2" dump badging "${BRIDGE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_badging.txt"
          "${BT}/aapt2" dump permissions "${CORE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/core_permissions.txt"
          "${BT}/aapt2" dump permissions "${BRIDGE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_permissions.txt"
          grep -F "package: name='com.mehmetcerdik.ownerai' versionCode='4' versionName='1.2.0'" "$GITHUB_WORKSPACE/owner_v4_1/out/core_badging.txt"
          grep -F "package: name='com.mehmetcerdik.ownerbridge' versionCode='2' versionName='1.1.0'" "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_badging.txt"
          ! grep -Fq "android.permission.INTERNET" "$GITHUB_WORKSPACE/owner_v4_1/out/core_permissions.txt"
          ! grep -Fq "android.permission.INTERNET" "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_permissions.txt"
          find "${ROOT}/core/build/intermediates" -iname 'AndroidManifest.xml' -print > "$GITHUB_WORKSPACE/owner_v4_1/out/core_manifest_paths.txt"
          find "${ROOT}/bridge/build/intermediates" -iname 'AndroidManifest.xml' -print > "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_manifest_paths.txt"
          grep -R "android.permission.BIND_ACCESSIBILITY_SERVICE" "${ROOT}/bridge/build/intermediates" > "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_accessibility_manifest_hits.txt"
          grep -R "accessibility_service_config" "${ROOT}/bridge/build/intermediates" >> "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_accessibility_manifest_hits.txt"
          grep -R "canPerformGestures" "${ROOT}/bridge/build/intermediates" >> "$GITHUB_WORKSPACE/owner_v4_1/out/bridge_accessibility_manifest_hits.txt"
          sha256sum "${CORE}" "${BRIDGE}" > "$GITHUB_WORKSPACE/owner_v4_1/out/unsigned_apk_sha256.txt"
          {
            echo "SOURCE_SHA256=${EXPECTED_SOURCE_SHA256}"
            echo "WRAPPER_SHA256=${EXPECTED_WRAPPER_SHA256}"
            echo "GRADLE_DIST_SHA256=${EXPECTED_GRADLE_DIST_SHA256}"
            echo "JAVA_VERSION=$(java -version 2>&1 | head -n 1)"
            echo "GRADLE_VERSION=$(gradle --version | awk '/Gradle /{print $2; exit}')"
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_API=${ANDROID_API}"
            echo "BUILD_TOOLS=${BUILD_TOOLS}"
            echo "COMPILE_PASS=PASS"
            echo "BUILD_PASS=PASS_UNSIGNED_APK"
            echo "SIGNER_PASS=NOT_TESTED"
            echo "DEVICE_PASS=NOT_TESTED"
          } > "$GITHUB_WORKSPACE/owner_v4_1/out/BUILD_EVIDENCE.txt"

      - name: Package exact local signing toolkit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner_v4_1/out/android-build-tools-35.0.0/lib
          cp "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" owner_v4_1/out/android-build-tools-35.0.0/
          cp "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" owner_v4_1/out/android-build-tools-35.0.0/
          cp "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2" owner_v4_1/out/android-build-tools-35.0.0/
          cp "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/lib/apksigner.jar" owner_v4_1/out/android-build-tools-35.0.0/lib/
          chmod +x owner_v4_1/out/android-build-tools-35.0.0/apksigner owner_v4_1/out/android-build-tools-35.0.0/zipalign owner_v4_1/out/android-build-tools-35.0.0/aapt2
          find owner_v4_1/out/android-build-tools-35.0.0 -type f -print0 | sort -z | xargs -0 sha256sum > owner_v4_1/out/build_tools_sha256.txt

      - name: Upload build evidence and unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: MEHMET_OWNER_V4_1_UNSIGNED_BUILD_AND_TOOLKIT
          path: owner_v4_1/out/
          if-no-files-found: error
          retention-days: 7
