name: KRAL Android emulator TLS to pinned OMEGA
on:
  push:
    paths:
      - 'app/src/main/java/com/example/gptasistan/OmegaReadOnlyStatus.kt'
      - 'app/src/androidTest/java/com/example/gptasistan/OmegaHttpsEmulatorTest.kt'
      - 'app/src/androidTest/java/com/example/gptasistan/OmegaSignedWireEmulatorTest.kt'
      - 'scripts/omega_ci_tls_loopback.py'
      - 'scripts/omega_emulator_tls_ci.sh'
      - '.github/workflows/omega-emulator-tls.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/example/gptasistan/OmegaReadOnlyStatus.kt'
      - 'app/src/androidTest/java/com/example/gptasistan/OmegaHttpsEmulatorTest.kt'
      - 'app/src/androidTest/java/com/example/gptasistan/OmegaSignedWireEmulatorTest.kt'
      - 'scripts/omega_ci_tls_loopback.py'
      - 'scripts/omega_emulator_tls_ci.sh'
      - '.github/workflows/omega-emulator-tls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-omega-real-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify KRAL exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/checkout@v4
        with:
          repository: mehmetcerdik457-ctrl/benim-uygulamam
          ref: 46894ad9d87ad7c75c3c51e003b1931e890199c4
          path: omega-pinned
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only OMEGA crypto dependency
        run: python -m pip install -r omega-pinned/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android HTTPS handshake with ephemeral test-only certificate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/omega_emulator_tls_ci.sh
      - name: Upload limited CI transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-omega-android-tls-emulator-evidence
          path: |
            build/omega-emulator-tls/health.json
            build/omega-emulator-tls/models.json
            build/omega-emulator-tls/chat.json
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
