name: Direct Head Matrix

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Direct Head - ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CI
            workflow_path: .github/workflows/ci.yml
            target_job: test
          - label: ANDROID_BUILD
            workflow_path: .github/workflows/android.yml
            target_job: build
          - label: SECURITY_STATE
            workflow_path: .github/workflows/platform-security-state.yml
            target_job: probe
          - label: CODEQL
            workflow_path: .github/workflows/security-supply-chain.yml
            target_job: CodeQL Java-Kotlin
          - label: SBOM_ATTESTATION
            workflow_path: .github/workflows/security-supply-chain.yml
            target_job: APK SBOM Provenance
          - label: GATE0
            workflow_path: .github/workflows/gate0-forensics.yml
            target_job: gate0
          - label: DEVCONTAINER
            workflow_path: .github/workflows/devcontainer-ci.yml
            target_job: verify-devcontainer
          - label: ADVANCED_FORENSICS
            workflow_path: .github/workflows/advanced-forensics-toolchain.yml
            target_job: advanced-forensics
          - label: REPRODUCIBILITY
            workflow_path: .github/workflows/reproducibility.yml
            target_job: reproducibility

    env:
      EXPECTED_SHA: ${{ github.event.after || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.after || github.sha }}
          persist-credentials: false

      - name: Exact direct-head SHA guard
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test -n "${EXPECTED_SHA}"
          test "${EXPECTED_SHA}" = "${actual}"

      - name: Wait for matching real workflow and verify target job
        shell: bash
        env:
          TARGET_WORKFLOW_PATH: ${{ matrix.workflow_path }}
          TARGET_JOB: ${{ matrix.target_job }}
        run: |
          set -euo pipefail
          echo "TARGET_WORKFLOW_PATH=${TARGET_WORKFLOW_PATH}"
          echo "TARGET_JOB=${TARGET_JOB}"
          run_id=""
          for attempt in $(seq 1 180); do
            payload="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=100")"
            run_id="$(jq -r --arg p "${TARGET_WORKFLOW_PATH}" \
              '[.workflow_runs[] | select(.path == $p)] | sort_by(.run_number) | last | .id // empty' \
              <<<"${payload}")"
            if [ -n "${run_id}" ]; then
              status="$(jq -r --argjson id "${run_id}" \
                '.workflow_runs[] | select(.id == $id) | .status' <<<"${payload}")"
              conclusion="$(jq -r --argjson id "${run_id}" \
                '.workflow_runs[] | select(.id == $id) | .conclusion // ""' <<<"${payload}")"
              echo "TARGET_RUN_ID=${run_id} STATUS=${status} CONCLUSION=${conclusion}"
              if [ "${status}" = "completed" ]; then
                test "${conclusion}" = "success"
                break
              fi
            fi
            if [ "${attempt}" = 180 ]; then
              echo "Timed out waiting for ${TARGET_WORKFLOW_PATH} at ${EXPECTED_SHA}" >&2
              exit 1
            fi
            sleep 20
          done

          jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          matched="$(jq -r --arg n "${TARGET_JOB}" \
            '[.jobs[] | select(.name == $n or (.name | startswith($n + " ")))][0].conclusion // empty' \
            <<<"${jobs}")"
          echo "TARGET_JOB_CONCLUSION=${matched}"
          test "${matched}" = "success"

  dependency-graph-admin-probe:
    name: Dependency Graph Admin Probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.after || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.after || github.sha }}
          persist-credentials: false

      - name: Exact direct-head SHA guard
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test "${EXPECTED_SHA}" = "${actual}"

      - name: Try supported dependency-security enablement path without weakening policy
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          get_code() {
            curl -sS -o /tmp/body.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$1"
          }
          before="$(get_code "${api}/dependency-graph/sbom")"
          echo "DEPENDENCY_GRAPH_SBOM_BEFORE_HTTP=${before}"

          if [ "${before}" = "200" ]; then
            echo "DEPENDENCY_GRAPH_OPERATIONAL=YES"
            exit 0
          fi

          enable_code="$(curl -sS -o /tmp/enable.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "${api}/vulnerability-alerts")"
          echo "VULNERABILITY_ALERTS_ENABLE_HTTP=${enable_code}"

          after="$(get_code "${api}/dependency-graph/sbom")"
          echo "DEPENDENCY_GRAPH_SBOM_AFTER_HTTP=${after}"

          if [ "${after}" = "200" ]; then
            echo "DEPENDENCY_GRAPH_OPERATIONAL=YES"
            depfix="$(curl -sS -o /tmp/depfix.json -w '%{http_code}' -X PUT \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "${api}/automated-security-fixes")"
            echo "DEPENDABOT_SECURITY_UPDATES_ENABLE_HTTP=${depfix}"
          else
            echo "DEPENDENCY_GRAPH_OPERATIONAL=NO"
            echo "DEPENDENCY_GRAPH_ENABLEMENT_REQUIRES_ADMIN_AUTHORITY=YES"
          fi
