name: Diagnose Owner Bridge Pair Android 15

on:
  push:
    branches:
      - diagnostic/owner-bridge-pair-api35-20260924
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p pair-evidence
          printf 'expected_sha=%s\nactual_sha=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" > pair-evidence/exact-head.txt

      - name: Acquire frozen signed Owner and Bridge from authenticated GitHub artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pair-evidence downloads
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10793362330/zip" \
            -o downloads/owner-diagnostics.zip
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10792715580/zip" \
            -o downloads/bridge-diagnostics.zip
          unzip -j downloads/owner-diagnostics.zip owner.apk -d pair-evidence
          unzip -j downloads/bridge-diagnostics.zip bridge.apk -d pair-evidence
          echo '55a179f96811671430556c99ee747280d648ead6833eaf7419009b4214be5394  pair-evidence/owner.apk' | sha256sum -c -
          echo '8588f221bd91baf9b8a6183267dd9180ab019a94264b6dfb0d112279802d48f2  pair-evidence/bridge.apk' | sha256sum -c -
          stat -c 'owner_size=%s' pair-evidence/owner.apk | tee pair-evidence/sizes.txt
          stat -c 'bridge_size=%s' pair-evidence/bridge.apk | tee -a pair-evidence/sizes.txt

      - name: Static pair identity and signer verification
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump badging pair-evidence/owner.apk | tee pair-evidence/owner-badging.txt
          "$BT/aapt2" dump badging pair-evidence/bridge.apk | tee pair-evidence/bridge-badging.txt
          "$BT/apksigner" verify --verbose --print-certs pair-evidence/owner.apk | tee pair-evidence/owner-apksigner.txt
          "$BT/apksigner" verify --verbose --print-certs pair-evidence/bridge.apk | tee pair-evidence/bridge-apksigner.txt
          grep -Fq "package: name='com.mehmetcerdik.ownerai' versionCode='4' versionName='1.2.0'" pair-evidence/owner-badging.txt
          grep -Fq "package: name='com.mehmetcerdik.ownerbridge' versionCode='2' versionName='1.1.0'" pair-evidence/bridge-badging.txt
          grep -Fiq '279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448' pair-evidence/owner-apksigner.txt
          grep -Fiq '279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448' pair-evidence/bridge-apksigner.txt

      - name: Prepare resilient pair UI verification helpers
        shell: bash
        run: |
          cat > pair-click.py <<'PY'
          import re, subprocess, time, xml.etree.ElementTree as ET
          OWNER='com.mehmetcerdik.ownerai/com.example.gptasistan.MainActivity'
          def dump_ui():
              subprocess.run(['adb','shell','uiautomator','dump','/sdcard/owner.xml'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(['adb','pull','/sdcard/owner.xml','pair-evidence/owner-ui.xml'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for attempt in range(4):
              dump_ui()
              try:
                  root=ET.parse('pair-evidence/owner-ui.xml').getroot()
              except Exception:
                  root=None
              if root is not None:
                  node=next((n for n in root.iter('node') if n.attrib.get('text') == 'OWNER Control Plane'), None)
                  if node is not None:
                      m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                      if not m:
                          raise SystemExit('OWNER_CONTROL_PLANE_BOUNDS_INVALID')
                      x1,y1,x2,y2=map(int,m.groups())
                      subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
                      print('OWNER_CONTROL_PLANE_BUTTON_TAPPED')
                      raise SystemExit(0)
                  texts=[n.attrib.get('text','') for n in root.iter('node')]
                  if any("isn't responding" in t or t in ('Close app','Wait') for t in texts):
                      subprocess.run(['adb','shell','input','keyevent','4'], check=False)
                      time.sleep(1)
              subprocess.run(['adb','shell','am','start','-W','-n',OWNER], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(2)
          raise SystemExit('OWNER_CONTROL_PLANE_BUTTON_NOT_FOUND_AFTER_RETRIES')
          PY
          cat > pair-verify.py <<'PY'
          import subprocess, time, xml.etree.ElementTree as ET
          required=['bridgeSignerMatch=true','ok=true','service=true','status=READY']
          last=''
          for attempt in range(5):
              subprocess.run(['adb','shell','uiautomator','dump','/sdcard/control.xml'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(['adb','pull','/sdcard/control.xml','pair-evidence/control-ui.xml'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  texts=[n.attrib.get('text','') for n in ET.parse('pair-evidence/control-ui.xml').getroot().iter('node')]
              except Exception:
                  texts=[]
              last='\n'.join(texts)
              open('pair-evidence/control-ui.txt','w').write(last)
              missing=[x for x in required if x not in last]
              if not missing:
                  print('OWNER_BRIDGE_PAIR_IPC_READY')
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('PAIR_IPC_NOT_READY missing='+','.join(x for x in required if x not in last))
          PY

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pair and prove Owner to Bridge IPC on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r pair-evidence/owner.apk | tee pair-evidence/owner-install.txt
            adb install -r pair-evidence/bridge.apk | tee pair-evidence/bridge-install.txt
            adb shell pm path com.mehmetcerdik.ownerai | tee pair-evidence/owner-pm-path.txt
            adb shell pm path com.mehmetcerdik.ownerbridge | tee pair-evidence/bridge-pm-path.txt
            adb shell settings put secure enabled_accessibility_services 'com.mehmetcerdik.ownerai/com.example.gptasistan.PhoneAgentAccessibilityService:com.mehmetcerdik.ownerbridge/com.mehmetcerdik.ownerbridge.BridgeAccessibilityService'
            adb shell settings put secure accessibility_enabled 1
            sleep 2
            adb shell am start -W -n com.mehmetcerdik.ownerai/com.example.gptasistan.MainActivity | tee pair-evidence/owner-launch.txt
            sleep 3
            python3 pair-click.py | tee pair-evidence/pair-click-result.txt
            sleep 2
            python3 pair-verify.py | tee pair-evidence/pair-ipc-result.txt
            adb shell dumpsys package com.mehmetcerdik.ownerai > pair-evidence/owner-dumpsys.txt
            adb shell dumpsys package com.mehmetcerdik.ownerbridge > pair-evidence/bridge-dumpsys.txt
            adb logcat -d -v threadtime > pair-evidence/logcat.txt

      - name: Freeze pair evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "git_head=$GITHUB_SHA"
            echo "owner_sha256=55a179f96811671430556c99ee747280d648ead6833eaf7419009b4214be5394"
            echo "bridge_sha256=8588f221bd91baf9b8a6183267dd9180ab019a94264b6dfb0d112279802d48f2"
            echo "signer_sha256=279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448"
            echo "android_api=35"
            cat pair-evidence/pair-ipc-result.txt 2>/dev/null || true
          } > pair-evidence/SUMMARY.txt
          (cd pair-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload pair diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-bridge-pair-api35-evidence
          path: pair-evidence/
          if-no-files-found: error
          retention-days: 30
