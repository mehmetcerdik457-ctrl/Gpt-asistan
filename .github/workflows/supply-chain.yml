name: Supply Chain Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/*.apk sbom.spdx.json | tee SHA256SUMS.txt

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@14e407ca15f1b08f4869fc058b059f7f1e434df6 # v4.2.1
        with:
          subject-path: app/build/outputs/apk/debug/*.apk

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@14e407ca15f1b08f4869fc058b059f7f1e434df6 # v4.2.1
        with:
          subject-path: app/build/outputs/apk/debug/*.apk
          sbom-path: sbom.spdx.json

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            sbom.spdx.json
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
