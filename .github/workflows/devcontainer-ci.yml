name: Devcontainer Toolchain

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-ci.yml'
      - '.github/workflows/direct-head-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Exact direct-head SHA guard
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test "${EXPECTED_SHA}" = "${actual}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached engineering lab image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          pull: true
          push: false
          load: true
          tags: gpt-asistan-engineering-lab:ci
          cache-from: type=gha,scope=gpt-asistan-devcontainer
          cache-to: type=gha,mode=max,scope=gpt-asistan-devcontainer

      - name: Verify installed toolchain and real sample execution
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            gpt-asistan-engineering-lab:ci \
            bash .devcontainer/verify-toolchain.sh | tee devcontainer-toolchain.log
          grep -Fx 'TOOLCHAIN_VERIFY=PASS' devcontainer-toolchain.log

      - name: Upload toolchain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devcontainer-toolchain-${{ github.sha }}
          path: devcontainer-toolchain.log
          if-no-files-found: error
          retention-days: 30
