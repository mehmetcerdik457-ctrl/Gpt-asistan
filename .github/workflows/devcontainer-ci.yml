name: Devcontainer Toolchain

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-ci.yml'
      - '.github/workflows/direct-head-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA: ${{ github.event.after || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.after || github.sha }}
          persist-credentials: false
      - name: Exact direct-head SHA guard
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test "${EXPECTED_SHA}" = "${actual}"
      - name: Build engineering lab image
        run: docker build --pull -f .devcontainer/Dockerfile -t gpt-asistan-engineering-lab .
      - name: Verify installed toolchain and real sample execution
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            gpt-asistan-engineering-lab \
            bash .devcontainer/verify-toolchain.sh | tee devcontainer-toolchain.log
          grep -Fx 'TOOLCHAIN_VERIFY=PASS' devcontainer-toolchain.log
      - name: Upload toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer-toolchain-${{ github.sha }}
          path: devcontainer-toolchain.log
          if-no-files-found: error
          retention-days: 30
