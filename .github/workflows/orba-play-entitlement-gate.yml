name: ORBA Play Entitlement Gate Offline Tests

on:
  push:
    branches:
      - 'audit/orba-play-entitlement-gate-*'
  pull_request:
    paths:
      - 'app/src/main/java/com/example/gptasistan/billing/**'
      - 'app/src/test/java/com/example/gptasistan/billing/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/example/gptasistan/OwnerGateway.kt'
      - 'app/src/main/java/com/example/gptasistan/OwnerIdentity.kt'
      - 'app/src/test/java/com/example/gptasistan/OwnerPlayGatewayTest.kt'
      - 'server/play_entitlement_gate.py'
      - 'server/play_subscription_lifecycle.py'
      - 'server/play_google_oauth.py'
      - 'server/play_voided_audit.py'
      - 'server/play_verified_snapshot.py'
      - 'server/tests/test_play_rtdn_snapshot.py'
      - 'server/tests/test_play_verified_snapshot.py'
      - 'server/tests/test_play_voided_audit.py'
      - 'server/tests/test_play_google_oauth.py'
      - 'server/tests/test_play_subscription_lifecycle.py'
      - 'server/play_google_api.py'
      - 'server/play_distribution_preflight.py'
      - 'server/play_bundle_preflight.py'
      - 'server/play_bundle_manifest_check.py'
      - 'server/play_apk_set_preflight.py'
      - 'server/tests/test_play_apk_set_preflight.py'
      - 'ci/orba_device_profiles/**'
      - 'server/tests/test_play_bundle_manifest_check.py'
      - 'server/tests/test_play_bundle_preflight.py'
      - 'server/tests/test_play_distribution_preflight.py'
      - 'server/play_subscription_mapper.py'
      - 'server/play_owner_binding.py'
      - 'server/play_account_id.py'
      - 'server/play_verification_service.py'
      - 'server/play_acknowledgement.py'
      - 'server/play_acknowledgement_service.py'
      - 'server/play_gateway_boundary.py'
      - 'server/play_rtdn.py'
      - 'server/tests/test_play_rtdn.py'
      - 'server/gateway.py'
      - 'server/tests/test_play_gateway_boundary.py'
      - 'server/tests/test_play_acknowledgement_service.py'
      - 'server/tests/test_play_entitlement_gate.py'
      - 'server/tests/test_play_google_api.py'
      - 'server/tests/test_play_subscription_mapper.py'
      - 'server/tests/test_play_owner_binding.py'
      - 'server/tests/test_play_account_id.py'
      - 'server/tests/test_play_verification_service.py'
      - '.github/workflows/orba-play-entitlement-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-entitlement-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify Android/server source package (production stays HOLD)
        run: python -m server.play_distribution_preflight --repo-root .
      - name: Compile decision gate
        run: python -m compileall -q server/play_apk_set_preflight.py server/tests/test_play_apk_set_preflight.py server/play_bundle_manifest_check.py server/tests/test_play_bundle_manifest_check.py server/play_bundle_preflight.py server/tests/test_play_bundle_preflight.py server/play_distribution_preflight.py server/tests/test_play_distribution_preflight.py server/play_verified_snapshot.py server/tests/test_play_verified_snapshot.py server/tests/test_play_rtdn_snapshot.py server/play_voided_audit.py server/tests/test_play_voided_audit.py server/play_google_oauth.py server/tests/test_play_google_oauth.py server/play_subscription_lifecycle.py server/tests/test_play_subscription_lifecycle.py server/play_entitlement_gate.py server/play_google_api.py server/play_subscription_mapper.py server/play_owner_binding.py server/play_account_id.py server/play_verification_service.py server/play_acknowledgement.py server/play_acknowledgement_service.py server/play_gateway_boundary.py server/play_rtdn.py server/gateway.py server/tests/test_play_gateway_boundary.py server/tests/test_play_rtdn.py server/tests/test_play_acknowledgement_service.py server/tests/test_play_entitlement_gate.py server/tests/test_play_google_api.py server/tests/test_play_subscription_mapper.py server/tests/test_play_owner_binding.py server/tests/test_play_account_id.py server/tests/test_play_verification_service.py
      - name: Install P-256 test dependency for signed HTTP boundary
        run: python -m pip install -r server/requirements.txt
      - name: Run offline entitlement regressions
        run: python -m unittest -v server.tests.test_play_apk_set_preflight server.tests.test_play_bundle_manifest_check server.tests.test_play_bundle_preflight server.tests.test_play_distribution_preflight server.tests.test_play_rtdn_snapshot server.tests.test_play_verified_snapshot server.tests.test_play_voided_audit server.tests.test_play_google_oauth server.tests.test_play_subscription_lifecycle server.tests.test_play_entitlement_gate server.tests.test_play_google_api server.tests.test_play_subscription_mapper server.tests.test_play_owner_binding server.tests.test_play_account_id server.tests.test_play_verification_service server.tests.test_play_acknowledgement_service server.tests.test_play_gateway_boundary server.tests.test_gateway server.tests.test_gateway_idempotency server.tests.test_play_rtdn

  android-purchase-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165f5e # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run all Android JVM unit tests (including Play)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Check Android lint issues
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Assemble unsigned-for-release debug APK (CI only)
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify compiled debug APK identity and certificate (production HOLD)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/aapt"
          test -x "$TOOLS/apksigner"
          "$TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/orba-apk-badging.txt
          "$TOOLS/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/orba-apk-signer.txt
          python -m server.play_distribution_preflight --repo-root . --apk-badging /tmp/orba-apk-badging.txt --apk-signing-report /tmp/orba-apk-signer.txt
      - name: Record debug APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload debug APK and checksum (test-only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orba-billing-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Build release-variant AAB (UNSIGNED CI STRUCTURE ONLY)
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Inspect unsigned AAB structure without Play credentials
        run: python -m server.play_bundle_preflight --repo-root . --bundle app/build/outputs/bundle/release/app-release.aab
      - name: Download checksum-pinned official bundletool 1.18.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --max-time 120 \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output /tmp/orba-bundletool-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/orba-bundletool-1.18.3.jar" | sha256sum --check --status
      - name: Decode real AAB base manifest with verified bundletool
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/orba-bundletool-1.18.3.jar dump manifest \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --module=base > /tmp/orba-aab-decoded-base-manifest.xml
          python -m server.play_bundle_manifest_check \
            --repo-root . --decoded-manifest /tmp/orba-aab-decoded-base-manifest.xml
      - name: Generate test-only signing key and device-profile APK splits (NOT PLAY)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/orba-ci-only-debug-key.jks' EXIT
          keytool -genkeypair -noprompt -keystore /tmp/orba-ci-only-debug-key.jks \
            -storepass orba_ci_testing_only -keypass orba_ci_testing_only \
            -alias orba_ci_ephemeral -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=ORBA CI TEMPORARY TEST ONLY,O=Offline Test,C=US"
          java -jar /tmp/orba-bundletool-1.18.3.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=/tmp/orba-ci-device-test.apks --mode=default \
            --ks=/tmp/orba-ci-only-debug-key.jks \
            --ks-pass=pass:orba_ci_testing_only \
            --ks-key-alias=orba_ci_ephemeral \
            --key-pass=pass:orba_ci_testing_only
          mkdir -p /tmp/orba-device-extracted
          for profile in api26-arm64 api30-x86_64 api36-arm64 api36-x86_64; do
            java -jar /tmp/orba-bundletool-1.18.3.jar extract-apks \
              --apks=/tmp/orba-ci-device-test.apks \
              --device-spec="ci/orba_device_profiles/${profile}.json" \
              --output-dir="/tmp/orba-device-extracted/${profile}"
          done
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          python -m server.play_apk_set_preflight \
            --repo-root . --apks /tmp/orba-ci-device-test.apks \
            --profile-dir ci/orba_device_profiles \
            --extracts-root /tmp/orba-device-extracted \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner"
          sha256sum /tmp/orba-ci-device-test.apks > /tmp/orba-ci-device-test.sha256
      - name: Upload derived device-profile APK set (TEST-ONLY, NOT PLAY)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orba-TEST-ONLY-device-apks-NOT-FOR-PLAY
          path: |
            /tmp/orba-ci-device-test.apks
            /tmp/orba-ci-device-test.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Record unsigned AAB SHA-256
        run: sha256sum app/build/outputs/bundle/release/app-release.aab | tee app/build/outputs/bundle/release/SHA256SUMS-UNSIGNED.txt
      - name: Upload unsigned AAB structural artifact (NOT FOR GOOGLE PLAY)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orba-UNSIGNED-aab-preflight-NOT-FOR-PLAY
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS-UNSIGNED.txt
          if-no-files-found: error
          retention-days: 7
