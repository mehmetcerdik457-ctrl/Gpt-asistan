name: ORBA Play Entitlement Gate Offline Tests

on:
  push:
    branches:
      - 'audit/orba-play-entitlement-gate-*'
  pull_request:
    paths:
      - 'server/play_entitlement_gate.py'
      - 'server/play_google_api.py'
      - 'server/tests/test_play_entitlement_gate.py'
      - 'server/tests/test_play_google_api.py'
      - '.github/workflows/orba-play-entitlement-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-entitlement-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile decision gate
        run: python -m compileall -q server/play_entitlement_gate.py server/play_google_api.py server/tests/test_play_entitlement_gate.py server/tests/test_play_google_api.py
      - name: Run offline entitlement regressions
        run: python -m unittest -v server.tests.test_play_entitlement_gate server.tests.test_play_google_api
