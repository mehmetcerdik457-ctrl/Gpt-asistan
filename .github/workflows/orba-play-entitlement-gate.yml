name: ORBA Play Entitlement Gate Offline Tests

on:
  push:
    branches:
      - 'audit/orba-play-entitlement-gate-*'
  pull_request:
    paths:
      - 'app/src/main/java/com/example/gptasistan/billing/**'
      - 'app/src/test/java/com/example/gptasistan/billing/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/example/gptasistan/OwnerGateway.kt'
      - 'app/src/main/java/com/example/gptasistan/OwnerIdentity.kt'
      - 'app/src/test/java/com/example/gptasistan/OwnerPlayGatewayTest.kt'
      - 'server/play_entitlement_gate.py'
      - 'server/play_subscription_lifecycle.py'
      - 'server/tests/test_play_subscription_lifecycle.py'
      - 'server/play_google_api.py'
      - 'server/play_subscription_mapper.py'
      - 'server/play_owner_binding.py'
      - 'server/play_account_id.py'
      - 'server/play_verification_service.py'
      - 'server/play_acknowledgement.py'
      - 'server/play_acknowledgement_service.py'
      - 'server/play_gateway_boundary.py'
      - 'server/play_rtdn.py'
      - 'server/tests/test_play_rtdn.py'
      - 'server/gateway.py'
      - 'server/tests/test_play_gateway_boundary.py'
      - 'server/tests/test_play_acknowledgement_service.py'
      - 'server/tests/test_play_entitlement_gate.py'
      - 'server/tests/test_play_google_api.py'
      - 'server/tests/test_play_subscription_mapper.py'
      - 'server/tests/test_play_owner_binding.py'
      - 'server/tests/test_play_account_id.py'
      - 'server/tests/test_play_verification_service.py'
      - '.github/workflows/orba-play-entitlement-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-entitlement-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile decision gate
        run: python -m compileall -q server/play_subscription_lifecycle.py server/tests/test_play_subscription_lifecycle.py server/play_entitlement_gate.py server/play_google_api.py server/play_subscription_mapper.py server/play_owner_binding.py server/play_account_id.py server/play_verification_service.py server/play_acknowledgement.py server/play_acknowledgement_service.py server/play_gateway_boundary.py server/play_rtdn.py server/gateway.py server/tests/test_play_gateway_boundary.py server/tests/test_play_rtdn.py server/tests/test_play_acknowledgement_service.py server/tests/test_play_entitlement_gate.py server/tests/test_play_google_api.py server/tests/test_play_subscription_mapper.py server/tests/test_play_owner_binding.py server/tests/test_play_account_id.py server/tests/test_play_verification_service.py
      - name: Install P-256 test dependency for signed HTTP boundary
        run: python -m pip install -r server/requirements.txt
      - name: Run offline entitlement regressions
        run: python -m unittest -v server.tests.test_play_subscription_lifecycle server.tests.test_play_entitlement_gate server.tests.test_play_google_api server.tests.test_play_subscription_mapper server.tests.test_play_owner_binding server.tests.test_play_account_id server.tests.test_play_verification_service server.tests.test_play_acknowledgement_service server.tests.test_play_gateway_boundary server.tests.test_gateway server.tests.test_gateway_idempotency server.tests.test_play_rtdn

  android-purchase-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165f5e # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Run Android purchase submission unit tests
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.gptasistan.billing.PlayPurchaseSubmissionTest' --tests 'com.example.gptasistan.billing.PlaySubscriptionCheckoutTest' --tests 'com.example.gptasistan.OwnerPlayGatewayTest' --no-daemon
      - name: Assemble unsigned-for-release debug APK (CI only)
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Record debug APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload debug APK and checksum (test-only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orba-billing-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
