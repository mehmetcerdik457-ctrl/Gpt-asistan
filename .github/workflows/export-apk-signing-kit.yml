name: Export Android APK Signing Kit

on:
  push:
    branches:
      - tools/apk-signing-kit-20260924

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate installed Android build tools
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/build-tools"
          BT_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT_DIR/apksigner"
          test -f "$BT_DIR/lib/apksigner.jar"
          test -x "$BT_DIR/zipalign"
          echo "build_tools_dir=$BT_DIR" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$(basename "$BT_DIR")" >> "$GITHUB_OUTPUT"

      - name: Stage signing kit
        shell: bash
        run: |
          set -euo pipefail
          BT_DIR="${{ steps.locate.outputs.build_tools_dir }}"
          mkdir -p out/lib
          cp "$BT_DIR/apksigner" out/apksigner
          cp "$BT_DIR/lib/apksigner.jar" out/lib/apksigner.jar
          cp "$BT_DIR/zipalign" out/zipalign
          cp "$BT_DIR/source.properties" out/source.properties || true
          chmod +x out/apksigner out/zipalign
          sha256sum out/apksigner out/lib/apksigner.jar out/zipalign > out/SHA256SUMS.txt
          {
            echo "exact_head=${GITHUB_SHA}"
            echo "build_tools_version=${{ steps.locate.outputs.build_tools_version }}"
            echo "sdk_root_present=true"
          } > out/MANIFEST.txt

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-kit
          path: out/
          if-no-files-found: error
          retention-days: 7
