name: OpenAI CI Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - control-plane-openai-ci-prep-20260919
    paths:
      - .github/workflows/openai-ci-preflight.yml

permissions:
  contents: read

concurrency:
  group: openai-ci-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: openai-ci
    steps:
      - name: Verify environment secret wiring without disclosure
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured for the openai-ci environment."
            exit 2
          fi
          echo "OPENAI_API_KEY wiring is present. Secret value was not printed."
