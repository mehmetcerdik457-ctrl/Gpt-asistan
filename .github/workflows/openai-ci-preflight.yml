name: OpenAI CI Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-ci-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: openai-ci
    steps:
      - name: Verify environment secret wiring without disclosure
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_CI_SECRET_WIRING=BLOCKED"
            exit 2
          fi
          echo "OPENAI_CI_SECRET_WIRING=PASS"
