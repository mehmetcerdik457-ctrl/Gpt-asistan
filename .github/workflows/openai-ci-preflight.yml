name: OpenAI CI Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-ci-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: openai-ci
    steps:
      - name: Verify environment secret wiring without disclosure
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_CI_SECRET_WIRING=BLOCKED"
            exit 2
          fi
          echo "OPENAI_CI_SECRET_WIRING=PASS"

      - name: Verify OpenAI Responses API acceptance
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          http_code="$(
            curl --silent --show-error               --connect-timeout 10               --max-time 60               --output "$body_file"               --write-out '%{http_code}'               --request POST 'https://api.openai.com/v1/responses'               --header 'Content-Type: application/json'               --header "Authorization: Bearer ${OPENAI_API_KEY}"               --data '{"model":"gpt-5.6-luna","input":"Return exactly OPENAI_CI_OK and nothing else.","max_output_tokens":16}'
          )"

          echo "OPENAI_RESPONSES_HTTP=${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "OPENAI_RESPONSES_ACCEPTANCE=FAIL"
            jq -r '{error_type:(.error.type // "unknown"), error_code:(.error.code // "unknown")}' "$body_file" 2>/dev/null || true
            exit 3
          fi

          marker="$(
            jq -r '[.output[]?.content[]? | select(.type == "output_text") | .text] | join("")' "$body_file"
          )"

          if [ "$marker" != "OPENAI_CI_OK" ]; then
            echo "OPENAI_RESPONSES_MARKER=FAIL"
            exit 4
          fi

          echo "OPENAI_RESPONSES_MARKER=OPENAI_CI_OK"
          echo "OPENAI_RESPONSES_ACCEPTANCE=PASS"
