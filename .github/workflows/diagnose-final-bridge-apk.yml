name: Diagnose Final Bridge APK
on:
  push:
    branches: [diagnostic/bridge-invalid-apk-20260924]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  exact-signed-api35-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconstruct and freeze exact canonical signed Bridge
        run: |
          set -eu
          base64 -d diagnostics/MEHMET_PRIVILEGED_BRIDGE_1.1.0_VC2_GEN2_SIGNED.apk.b64 > bridge-final.apk
          ACTUAL="$(sha256sum bridge-final.apk | awk '{print $1}')"
          echo "actual_sha256=$ACTUAL"
          test "$ACTUAL" = "8588f221bd91baf9b8a6183267dd9180ab019a94264b6dfb0d112279802d48f2"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install exact signed Bridge on clean Android 15 / API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release > android-release.txt
            adb shell getprop ro.build.version.sdk > android-sdk.txt
            adb install -r bridge-final.apk > adb-install.txt 2>&1
            CODE=$?
            cat adb-install.txt
            echo "adb_install_exit=$CODE" >> adb-install.txt
            if [ "$CODE" -ne 0 ]; then
              adb logcat -d -v brief | grep -E 'PackageManager|PackageInstaller|installd|INSTALL_' | tail -400 > package-manager-log.txt || true
              cat package-manager-log.txt || true
              exit "$CODE"
            fi
            adb shell pm path com.mehmetcerdik.ownerbridge > pm-path.txt
            cat pm-path.txt
            adb shell dumpsys package com.mehmetcerdik.ownerbridge | grep -E 'versionCode|versionName|codePath|pkg=' | head -40 > package-dump.txt
            cat package-dump.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-final-bridge-api35-install-diagnostics
          path: |
            android-release.txt
            android-sdk.txt
            adb-install.txt
            pm-path.txt
            package-dump.txt
            package-manager-log.txt
          if-no-files-found: warn
          retention-days: 30
