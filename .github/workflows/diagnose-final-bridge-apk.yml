name: Diagnose Final Bridge APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-signed-api35-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconstruct and freeze exact canonical signed Bridge
        shell: bash
        run: |
          set -euo pipefail
          base64 -d diagnostics/MEHMET_PRIVILEGED_BRIDGE_1.1.0_VC2_GEN2_SIGNED.apk.b64 > bridge-final.apk
          ACTUAL="$(sha256sum bridge-final.apk | awk '{print $1}')"
          echo "actual_sha256=${ACTUAL}"
          test "${ACTUAL}" = "8588f221bd91baf9b8a6183267dd9180ab019a94264b6dfb0d112279802d48f2"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install exact signed Bridge on clean Android 15 / API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release > android-release.txt
            adb shell getprop ro.build.version.sdk > android-sdk.txt
            sh -c 'set +e; adb install -r bridge-final.apk > adb-install.txt 2>&1; rc=$?; echo "$rc" > adb-install.rc; exit 0'
            cat adb-install.txt
            sh -c 'adb shell pm path com.mehmetcerdik.ownerbridge > pm-path.txt 2>&1; exit 0'
            sh -c 'adb shell dumpsys package com.mehmetcerdik.ownerbridge > package-dump.txt 2>&1; exit 0'
            sh -c 'adb logcat -d -v brief > package-manager-log.txt 2>&1; exit 0'

      - name: Assert platform install
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat adb-install.rc)" = "0"
          grep -q '^Success$' adb-install.txt
          grep -q 'com.mehmetcerdik.ownerbridge' pm-path.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-final-bridge-api35-install-diagnostics
          path: |
            android-release.txt
            android-sdk.txt
            adb-install.txt
            adb-install.rc
            pm-path.txt
            package-dump.txt
            package-manager-log.txt
          if-no-files-found: warn
          retention-days: 30
