name: Stripe Customer Binding Guard

on:
  push:
    branches:
      - 'audit/stripe-customer-binding-guard-*'
  pull_request:
    paths:
      - 'server/stripe_billing.py'
      - 'server/tests/test_stripe_billing.py'
      - '.github/workflows/stripe-customer-binding-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile billing bridge
        run: python -m compileall -q server/stripe_billing.py server/tests/test_stripe_billing.py
      - name: Run Stripe webhook regressions
        run: python -m unittest -v server.tests.test_stripe_billing
