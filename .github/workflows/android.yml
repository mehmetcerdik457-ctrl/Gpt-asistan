name: Build Stable Owner Companion
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED_SHA="${GITHUB_SHA}"
          fi
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "${EXPECTED_SHA}" "${ACTUAL_SHA}" > /tmp/android-exact-head.txt

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit-test phone-agent policy
        run: gradle :app:testDebugUnitTest

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease

      - name: Generate unsigned release evidence
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "${APK}"
          mkdir -p android-evidence signing-toolkit
          cp /tmp/android-exact-head.txt android-evidence/exact-head.txt
          HEAD_SHA="$(sed -n 's/^actual_sha=//p' /tmp/android-exact-head.txt)"
          test -n "${HEAD_SHA}"

          BUILD_TOOLS_VERSION="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          AAPT="${BUILD_TOOLS}/aapt"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"

          ALIGNED="android-evidence/MEHMET_OWNER_COMPANION_1.2.0_VC4_UNSIGNED_ALIGNED.apk"
          "${ZIPALIGN}" -f -p 4 "${APK}" "${ALIGNED}"

          APK_HASH="$(sha256sum "${ALIGNED}" | awk '{print $1}')"
          printf '%s  %s\n' "${APK_HASH}" "$(basename "${ALIGNED}")" > android-evidence/APK_UNSIGNED_SHA256
          "${AAPT}" dump badging "${ALIGNED}" > android-evidence/apk-badging.txt
          "${AAPT}" dump permissions "${ALIGNED}" > android-evidence/apk-permissions.txt
          "${AAPT}" dump xmltree "${ALIGNED}" AndroidManifest.xml > android-evidence/manifest-tree.txt

          grep -q "package: name='com.mehmetcerdik.ownerai'" android-evidence/apk-badging.txt
          grep -q "versionCode='4'" android-evidence/apk-badging.txt
          grep -q "versionName='1.2.0'" android-evidence/apk-badging.txt
          grep -q 'PhoneAgentAccessibilityService' android-evidence/manifest-tree.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' android-evidence/manifest-tree.txt
          if grep -q 'android.permission.INTERNET' android-evidence/apk-permissions.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

          {
            echo "artifact_path=${ALIGNED}"
            echo "artifact_size=$(stat -c '%s' "${ALIGNED}")"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "git_head=${HEAD_SHA}"
            echo "unsigned_apk_sha256=${APK_HASH}"
            echo "build_tools_version=${BUILD_TOOLS_VERSION}"
            echo "application_id=com.mehmetcerdik.ownerai"
            echo "version_code=4"
            echo "version_name=1.2.0"
            echo "expected_signer_cert_sha256=279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448"
            echo "phone_agent_runtime=v1_accessibility_dynamic_evidence"
            echo "network_permission=NONE"
            echo "signing_state=UNSIGNED_ALIGNED_READY_FOR_GEN2"
          } > android-evidence/build-metadata.txt

          cat > android-evidence/device-expected-pre-sign.json <<EOF
          {
            "git_head": "${HEAD_SHA}",
            "package_name": "com.mehmetcerdik.ownerai",
            "version_name": "1.2.0",
            "version_code": "4",
            "expected_signer_cert_sha256": "279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448",
            "unsigned_artifact_sha256": "${APK_HASH}",
            "phone_agent_runtime": "v1_accessibility_dynamic_evidence",
            "network_permission": "NONE"
          }
          EOF

          cp "${BUILD_TOOLS}/apksigner" signing-toolkit/
          cp "${ZIPALIGN}" signing-toolkit/
          cp "${BUILD_TOOLS}/aapt2" signing-toolkit/
          cp -a "${BUILD_TOOLS}/lib" signing-toolkit/
          if [ -d "${BUILD_TOOLS}/lib64" ]; then cp -a "${BUILD_TOOLS}/lib64" signing-toolkit/; fi
          tar -czf android-evidence/android-signing-toolkit.tar.gz -C signing-toolkit .

          test "${APK_HASH}" = "$(sha256sum "${ALIGNED}" | awk '{print $1}')"

      - name: Upload unsigned stable Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: stable-owner-companion-unsigned-release
          path: android-evidence/MEHMET_OWNER_COMPANION_1.2.0_VC4_UNSIGNED_ALIGNED.apk
          if-no-files-found: error

      - name: Upload Android build evidence and signing toolkit
        uses: actions/upload-artifact@v4
        with:
          name: stable-owner-companion-build-evidence
          path: android-evidence/
          if-no-files-found: error
