name: Build Owner Companion
on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${GITHUB_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "${EXPECTED_SHA}" "${ACTUAL_SHA}" > /tmp/android-exact-head.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit-test phone-agent policy
        run: gradle :app:testDebugUnitTest

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease

      - name: Generate Owner Companion build inputs and evidence
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"
          test -n "${UNSIGNED}"
          BUILD_TOOLS_VERSION="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign"
          APKSIGNER_JAR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/lib/apksigner.jar"
          test -x "${AAPT}"
          test -x "${ZIPALIGN}"
          test -s "${APKSIGNER_JAR}"

          ALIGNED="app/build/outputs/apk/release/MEHMET_Owner_Companion_v1.0.0_1_aligned_unsigned.apk"
          "${ZIPALIGN}" -p -f 4 "${UNSIGNED}" "${ALIGNED}"
          "${ZIPALIGN}" -c -v 4 "${ALIGNED}"

          mkdir -p android-evidence
          cp /tmp/android-exact-head.txt android-evidence/exact-head.txt
          cp "${APKSIGNER_JAR}" android-evidence/apksigner.jar

          APK_HASH="$(sha256sum "${ALIGNED}" | awk '{print $1}')"
          APKSIGNER_JAR_HASH="$(sha256sum "${APKSIGNER_JAR}" | awk '{print $1}')"
          printf '%s  %s\n' "${APK_HASH}" "$(basename "${ALIGNED}")" > android-evidence/APK_SHA256
          printf '%s  apksigner.jar\n' "${APKSIGNER_JAR_HASH}" > android-evidence/APKSIGNER_JAR_SHA256

          "${AAPT}" dump badging "${ALIGNED}" > android-evidence/apk-badging.txt
          "${AAPT}" dump permissions "${ALIGNED}" > android-evidence/apk-permissions.txt
          "${AAPT}" dump xmltree "${ALIGNED}" AndroidManifest.xml > android-evidence/manifest-tree.txt

          grep -q "package: name='com.mehmetcerdik.ownercompanion'" android-evidence/apk-badging.txt
          grep -q "versionCode='1'" android-evidence/apk-badging.txt
          grep -q "versionName='1.0.0'" android-evidence/apk-badging.txt
          grep -q 'PhoneAgentAccessibilityService' android-evidence/manifest-tree.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' android-evidence/manifest-tree.txt
          if grep -q 'android.permission.INTERNET' android-evidence/apk-permissions.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

          {
            echo "artifact_path=${ALIGNED}"
            echo "artifact_size=$(stat -c '%s' "${ALIGNED}")"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "git_head=${GITHUB_SHA}"
            echo "package_name=com.mehmetcerdik.ownercompanion"
            echo "version_name=1.0.0"
            echo "version_code=1"
            echo "aligned_unsigned_sha256=${APK_HASH}"
            echo "expected_release_signer_sha256=93c8a51c1f3d929b55928c97dae8cfc7aa337911507649e9891f46150043b82b"
            echo "build_tools_version=${BUILD_TOOLS_VERSION}"
            echo "apksigner_jar_sha256=${APKSIGNER_JAR_HASH}"
            echo "phone_agent_runtime=v1_accessibility_dynamic_evidence"
            echo "network_permission=NONE"
          } > android-evidence/build-metadata.txt

          cat > android-evidence/device-expected-template.json <<EOF
          {
            "git_head": "${GITHUB_SHA}",
            "package_name": "com.mehmetcerdik.ownercompanion",
            "version_name": "1.0.0",
            "version_code": "1",
            "aligned_unsigned_sha256": "${APK_HASH}",
            "expected_release_signer_sha256": "93c8a51c1f3d929b55928c97dae8cfc7aa337911507649e9891f46150043b82b",
            "phone_agent_runtime": "v1_accessibility_dynamic_evidence",
            "network_permission": "NONE"
          }
          EOF

          test "${APK_HASH}" = "$(sha256sum "${ALIGNED}" | awk '{print $1}')"

      - name: Upload signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: owner-companion-stable-v1-build-inputs
          path: |
            app/build/outputs/apk/release/MEHMET_Owner_Companion_v1.0.0_1_aligned_unsigned.apk
            android-evidence/apksigner.jar
          if-no-files-found: error

      - name: Upload Owner Companion build evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-companion-stable-v1-evidence
          path: |
            android-evidence/
            !android-evidence/apksigner.jar
          if-no-files-found: error
