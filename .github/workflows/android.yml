name: Build APK
on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${GITHUB_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "${EXPECTED_SHA}" "${ACTUAL_SHA}" > /tmp/android-exact-head.txt

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
            unzip -q gradle.zip -d gradle-8.7
            printf '#!/usr/bin/env sh\nexec "$(pwd)/gradle-8.7/gradle-8.7/bin/gradle" "$@"\n' > gradlew
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Generate APK evidence
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${APK}"
          mkdir -p android-evidence
          cp /tmp/android-exact-head.txt android-evidence/exact-head.txt
          APK_HASH="$(sha256sum "${APK}" | awk '{print $1}')"
          printf '%s  %s\n' "${APK_HASH}" "$(basename "${APK}")" > android-evidence/APK_SHA256
          BUILD_TOOLS_VERSION="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          test -x "${AAPT}"
          test -x "${APKSIGNER}"
          "${AAPT}" dump badging "${APK}" > android-evidence/apk-badging.txt
          "${APKSIGNER}" verify --print-certs "${APK}" > android-evidence/apksigner.txt
          grep -q "package: name='com.example.gptasistan' versionCode='1' versionName='1.0.0'" android-evidence/apk-badging.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' android-evidence/apksigner.txt
          {
            echo "artifact_path=${APK}"
            echo "artifact_size=$(stat -c '%s' "${APK}")"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "git_head=${GITHUB_SHA}"
            echo "apk_sha256=${APK_HASH}"
            echo "build_tools_version=${BUILD_TOOLS_VERSION}"
          } > android-evidence/build-metadata.txt
          cat > android-evidence/device-expected.json <<EOF
          {
            "git_head": "${GITHUB_SHA}",
            "package_name": "com.example.gptasistan",
            "version_name": "1.0.0",
            "version_code": "1",
            "artifact_sha256": "${APK_HASH}"
          }
          EOF
          test "${APK_HASH}" = "$(sha256sum "${APK}" | awk '{print $1}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android build evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-build-evidence
          path: android-evidence/
          if-no-files-found: error
