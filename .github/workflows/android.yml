name: Kral Android Debug Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Inspect hosted Android SDK
        run: |
          echo "SDK location: $ANDROID_HOME"
          ls -d "$ANDROID_HOME"/platforms/android-* || true
          ls -d "$ANDROID_HOME"/build-tools/* || true
      - name: Run unit tests and assemble APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kral-asistan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
