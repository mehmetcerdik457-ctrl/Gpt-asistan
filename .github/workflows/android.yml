name: Build APK
on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${GITHUB_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "${EXPECTED_SHA}" "${ACTUAL_SHA}" > /tmp/android-exact-head.txt

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit-test phone-agent policy
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Generate APK evidence
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${APK}"
          mkdir -p android-evidence
          cp /tmp/android-exact-head.txt android-evidence/exact-head.txt
          APK_HASH="$(sha256sum "${APK}" | awk '{print $1}')"
          printf '%s  %s\n' "${APK_HASH}" "$(basename "${APK}")" > android-evidence/APK_SHA256
          BUILD_TOOLS_VERSION="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          "${AAPT}" dump badging "${APK}" > android-evidence/apk-badging.txt
          "${AAPT}" dump permissions "${APK}" > android-evidence/apk-permissions.txt
          "${AAPT}" dump xmltree "${APK}" AndroidManifest.xml > android-evidence/manifest-tree.txt
          "${APKSIGNER}" verify --print-certs "${APK}" > android-evidence/apksigner.txt
          grep -q "package: name='com.example.gptasistan'" android-evidence/apk-badging.txt
          grep -q "versionCode='2'" android-evidence/apk-badging.txt
          grep -q "versionName='1.1.0'" android-evidence/apk-badging.txt
          grep -q 'PhoneAgentAccessibilityService' android-evidence/manifest-tree.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' android-evidence/manifest-tree.txt
          if grep -q 'android.permission.INTERNET' android-evidence/apk-permissions.txt; then echo "Unexpected INTERNET permission"; exit 1; fi
          {
            echo "artifact_path=${APK}"
            echo "artifact_size=$(stat -c '%s' "${APK}")"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "git_head=${GITHUB_SHA}"
            echo "apk_sha256=${APK_HASH}"
            echo "build_tools_version=${BUILD_TOOLS_VERSION}"
            echo "phone_agent_runtime=v1_accessibility"
            echo "network_permission=NONE"
          } > android-evidence/build-metadata.txt
          cat > android-evidence/device-expected.json <<EOF
          {
            "git_head": "${GITHUB_SHA}",
            "package_name": "com.example.gptasistan",
            "version_name": "1.1.0",
            "version_code": "2",
            "artifact_sha256": "${APK_HASH}",
            "phone_agent_runtime": "v1_accessibility"
          }
          EOF
          test "${APK_HASH}" = "$(sha256sum "${APK}" | awk '{print $1}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-agent-runtime-v1-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android build evidence
        uses: actions/upload-artifact@v4
        with:
          name: phone-agent-runtime-v1-evidence
          path: android-evidence/
          if-no-files-found: error
