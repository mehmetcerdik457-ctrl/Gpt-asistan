name: Hardened Owner 1.5 Build

on:
  push:
    branches:
      - owner/final-hardening-v1-20260929
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED_SHA="${GITHUB_SHA}"
          fi
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          printf 'expected_sha=%s\nactual_sha=%s\n' "${EXPECTED_SHA}" "${ACTUAL_SHA}" > /tmp/android-exact-head.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Unit and negative security tests
        run: gradle :app:testDebugUnitTest

      - name: Static production security gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "1.5.0"' app/build.gradle.kts
          grep -q 'isDebuggable = false' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'PhoneAgentAccessibilityService' app/src/main/AndroidManifest.xml
          grep -q 'PhoneAgentAccessibilityService' app/src/debug/AndroidManifest.xml

          grep -q 'CANONICAL = "https://api.openai.com/v1/responses"' app/src/main/java/com/mehmetcerdik/ownerai/ProviderEndpointPolicy.java
          grep -q 'setInstanceFollowRedirects(false)' app/src/main/java/com/mehmetcerdik/ownerai/OwnerBrainEngine.java
          grep -q 'PROVIDER_REDIRECT_DENIED' app/src/main/java/com/mehmetcerdik/ownerai/OwnerBrainEngine.java
          grep -q 'setUserAuthenticationRequired(true)' app/src/main/java/com/mehmetcerdik/ownerai/SecureSecrets.java
          grep -q 'AUTH_VALIDITY_SECONDS = 30' app/src/main/java/com/mehmetcerdik/ownerai/SecureSecrets.java
          grep -q 'DEVICE_KEY_AUTH_VALIDITY_SECONDS = 30' app/src/main/java/com/mehmetcerdik/ownerai/TrustedDeviceManager.java
          grep -q 'setUserAuthenticationRequired(true)' app/src/main/java/com/mehmetcerdik/ownerai/TrustedDeviceManager.java
          ! grep -q 'BIOMETRIC_WEAK' app/src/main/java/com/mehmetcerdik/ownerai/OwnerAuth.java
          grep -q 'DEVICE_BOUND_LOCAL_SECURE_SESSION' app/src/main/java/com/mehmetcerdik/ownerai/OwnerSession.java
          grep -q 'ACTION_TARGET_NOT_BOUND_TO_OWNER_INTENT' app/src/main/java/com/mehmetcerdik/ownerai/OwnerBrainPolicy.java
          python3 -c 'from pathlib import Path; s=Path("app/src/main/java/com/mehmetcerdik/ownerai/OwnerToolBus.java").read_text(); policy=s.index("OwnerBrainPolicy.authorize("); arm=s.index("BridgeClient.arm("); assert policy < arm, "Bridge is armed before policy authorization"'
          grep -q 'CIHAT_VERIFY_RESPONSE' app/src/main/java/com/mehmetcerdik/ownerai/CihatSemanticAdapter.java
          grep -q 'previous_record_hash' app/src/main/java/com/mehmetcerdik/ownerai/OwnerMemory.java
          grep -q 'HmacSHA256' app/src/main/java/com/mehmetcerdik/ownerai/AuditIntegrity.java
          grep -q 'CLIENT_SECRET_PATH = "/v1/realtime/client_secrets"' app/src/main/java/com/mehmetcerdik/ownerai/RealtimeVoicePolicy.java
          grep -q 'WEBRTC_CALLS_PATH = "/v1/realtime/calls"' app/src/main/java/com/mehmetcerdik/ownerai/RealtimeVoicePolicy.java
          grep -q 'TRUSTED_EPHEMERAL_TOKEN_ISSUER_REQUIRED_NOT_RUNTIME_VERIFIED' app/src/main/java/com/mehmetcerdik/ownerai/RealtimeVoicePolicy.java

          grep -q 'versionCode = 3' bridge/build.gradle.kts
          grep -q 'versionName = "1.2.0"' bridge/build.gradle.kts
          grep -q 'android:packageNames="com.mehmetcerdik.ownerai,com.codespaceapps.aichat"' bridge/src/main/res/xml/accessibility_service_config.xml
          grep -q 'WORKER_SIGNER = "7b4a4b483ad4fdfa7bcab3c4ba9fd5a0461cab208fc7120a4d8d2f4901b3a097"' bridge/src/main/java/com/mehmetcerdik/ownerbridge/BridgeSecurity.java
          grep -q 'SENSITIVE_SURFACE_FAIL_CLOSED' bridge/src/main/java/com/mehmetcerdik/ownerbridge/BridgeAccessibilityService.java

          if grep -R -nE 'android\.util\.Log\.|Log\.(d|i|v|w|e)\(' app/src/main bridge/src/main; then
            echo "Production logging call found" >&2
            exit 31
          fi
          if grep -R -nE 'sk-[A-Za-z0-9_-]{16,}' app/src/main bridge/src/main; then
            echo "Provider secret-like literal found" >&2
            exit 32
          fi

      - name: Build exact-head owner and bridge release APKs
        shell: bash
        run: |
          set -euo pipefail
          export OWNER_BUILD_GIT_SHA="$(git rev-parse HEAD)"
          gradle :app:assembleRelease :bridge:assembleRelease

      - name: Generate release build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardened-evidence
          cp /tmp/android-exact-head.txt hardened-evidence/exact-head.txt
          HEAD_SHA="$(git rev-parse HEAD)"

          OWNER_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          BRIDGE_APK="$(find bridge/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "${OWNER_APK}" && test -n "${BRIDGE_APK}"

          BUILD_TOOLS_VERSION="$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          AAPT="${BUILD_TOOLS}/aapt"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"

          OWNER_ALIGNED="hardened-evidence/MEHMET_OWNER_COMPANION_1.5.0_VC8_UNSIGNED_ALIGNED.apk"
          BRIDGE_ALIGNED="hardened-evidence/MEHMET_OWNER_BRIDGE_1.2.0_VC3_UNSIGNED_ALIGNED.apk"
          "${ZIPALIGN}" -f -p 4 "${OWNER_APK}" "${OWNER_ALIGNED}"
          "${ZIPALIGN}" -f -p 4 "${BRIDGE_APK}" "${BRIDGE_ALIGNED}"

          unzip -t "${OWNER_ALIGNED}" > hardened-evidence/owner-zip-integrity.txt
          unzip -t "${BRIDGE_ALIGNED}" > hardened-evidence/bridge-zip-integrity.txt
          "${AAPT}" dump badging "${OWNER_ALIGNED}" > hardened-evidence/owner-badging.txt
          "${AAPT}" dump badging "${BRIDGE_ALIGNED}" > hardened-evidence/bridge-badging.txt
          "${AAPT}" dump xmltree "${OWNER_ALIGNED}" AndroidManifest.xml > hardened-evidence/owner-manifest-tree.txt
          "${AAPT}" dump xmltree "${BRIDGE_ALIGNED}" AndroidManifest.xml > hardened-evidence/bridge-manifest-tree.txt

          grep -q "package: name='com.mehmetcerdik.ownerai'" hardened-evidence/owner-badging.txt
          grep -q "versionCode='7'" hardened-evidence/owner-badging.txt
          grep -q "versionName='1.5.0'" hardened-evidence/owner-badging.txt
          ! grep -q "application-debuggable" hardened-evidence/owner-badging.txt
          ! grep -q "PhoneAgentAccessibilityService" hardened-evidence/owner-manifest-tree.txt

          grep -q "package: name='com.mehmetcerdik.ownerbridge'" hardened-evidence/bridge-badging.txt
          grep -q "versionCode='3'" hardened-evidence/bridge-badging.txt
          grep -q "versionName='1.2.0'" hardened-evidence/bridge-badging.txt
          ! grep -q "application-debuggable" hardened-evidence/bridge-badging.txt

          unzip -p "${OWNER_ALIGNED}" classes.dex > /tmp/owner-classes.dex
          grep -aFq "${HEAD_SHA}" /tmp/owner-classes.dex
          rm -f /tmp/owner-classes.dex

          OWNER_HASH="$(sha256sum "${OWNER_ALIGNED}" | awk '{print $1}')"
          BRIDGE_HASH="$(sha256sum "${BRIDGE_ALIGNED}" | awk '{print $1}')"
          printf '%s  %s\n%s  %s\n'             "${OWNER_HASH}" "$(basename "${OWNER_ALIGNED}")"             "${BRIDGE_HASH}" "$(basename "${BRIDGE_ALIGNED}")"             > hardened-evidence/SHA256SUMS

          cat > hardened-evidence/release-manifest.json <<EOF
          {
            "git_head": "${HEAD_SHA}",
            "owner": {
              "package": "com.mehmetcerdik.ownerai",
              "version_name": "1.5.0",
              "version_code": 8,
              "unsigned_aligned_sha256": "${OWNER_HASH}",
              "expected_production_signer_sha256": "279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448"
            },
            "bridge": {
              "package": "com.mehmetcerdik.ownerbridge",
              "version_name": "1.2.0",
              "version_code": 3,
              "unsigned_aligned_sha256": "${BRIDGE_HASH}",
              "expected_production_signer_sha256": "279084a36b7c17a1663bfba5fe1c5bdac974f8ef4ce56b21000d882493e39448"
            },
            "public_cihat": {
              "package": "com.codespaceapps.aichat",
              "expected_version_name": "3.2.1",
              "expected_version_code": 893,
              "expected_signer_sha256": "7b4a4b483ad4fdfa7bcab3c4ba9fd5a0461cab208fc7120a4d8d2f4901b3a097",
              "mutation": "FORBIDDEN"
            },
            "signing_state": "UNSIGNED_ALIGNED_AWAITING_EXISTING_OWNER_SIGNER"
          }
          EOF
          (cd hardened-evidence && sha256sum -c SHA256SUMS)

      - name: Upload hardened unsigned release and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: hardened-owner-1-5-release-evidence
          path: hardened-evidence/
          if-no-files-found: error
