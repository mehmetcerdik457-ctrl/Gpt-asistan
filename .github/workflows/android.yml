name: Kral Android Candidate Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests, lint and assemble candidate APK
        shell: bash
        run: |
          mkdir -p build/delivery
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build/delivery/gradle.log
      - name: Check unsigned release variant package without publishing it
        if: success()
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > build/delivery/release-variant-badging.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.android_artifact import EXPECTED_CANDIDATE_PACKAGE, field
          text = Path('build/delivery/release-variant-badging.txt').read_text()
          package = field(r"^package: name='([^']+)'", text)
          assert package == EXPECTED_CANDIDATE_PACKAGE, 'Release targets an unexpected package'
          assert 'application-debuggable' not in text, 'Release variant is debuggable'
          result = {'package': package, 'release_variant_package_verified': True,
                    'debuggable': False, 'signature_verified': False,
                    'installable_release_delivered': False}
          Path('build/delivery/release-variant-check.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Verify APK signature and record source and SHA-256
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk build/delivery/app-debug.apk
          python3 scripts/android_artifact.py build/delivery/app-debug.apk build/delivery --expected-package com.example.gptasistan.genesis
          git archive --format=tar.gz --output=build/delivery/source.tar.gz HEAD
          cd build/delivery
          sha256sum source.tar.gz > SOURCE-SHA256SUMS
      - name: Upload candidate APK and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kral-asistan-candidate-apk
          path: |
            build/delivery/app-debug.apk
            build/delivery/apk-metadata.json
            build/delivery/APK-SHA256SUMS
          if-no-files-found: error
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-asistan-build-evidence
          path: |
            build/delivery/
            !build/delivery/app-debug.apk
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kral-asistan-candidate-apk
          path: build/emulator/apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the fresh emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install canonical APK and check owner lock screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_emulator_smoke.sh
      - name: Upload emulator installation and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kral-asistan-emulator-evidence
          path: build/emulator/evidence/
          if-no-files-found: warn
