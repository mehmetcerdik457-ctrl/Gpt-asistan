name: Security and Supply Chain

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: CodeQL Java-Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CodeQL CLI 2.27.0 cannot instrument Kotlin 2.4.20 yet.
      # Production/default builds stay on patched Kotlin 2.4.20.
      # This isolated scan-only override uses 2.4.10 with all Gradle build caching disabled.
      KOTLIN_VERSION_OVERRIDE: '2.4.10'
      GRADLE_OPTS: '-Dorg.gradle.caching=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: java-kotlin
      - name: Build for CodeQL
        run: |
          set -euo pipefail
          echo "CodeQL compatibility Kotlin=${KOTLIN_VERSION_OVERRIDE}; build cache disabled"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-build-cache -Pkotlin.incremental=false --stacktrace
          else
            gradle :app:assembleDebug --no-build-cache -Pkotlin.incremental=false --stacktrace
          fi
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:java-kotlin

  supply-chain:
    permissions:
      contents: read
    name: APK SBOM Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - name: Build APK
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - name: Capture immutable evidence
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p release-evidence/apk-unpacked
          cp "$APK" release-evidence/app-debug.apk
          unzip -q release-evidence/app-debug.apk -d release-evidence/apk-unpacked
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "filename=$(basename "$APK")"
            echo "size=$(stat -c%s "$APK")"
            echo "sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "sha512=$(sha512sum "$APK" | awk '{print $1}')"
          } | tee release-evidence/evidence.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release-evidence/apk-unpacked
          format: spdx-json
          output-file: release-evidence/app-debug.spdx.json
          upload-artifact: false
      - name: Generate SHA-256 evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-evidence
            sha256sum app-debug.apk app-debug.spdx.json | tee SHA256SUMS.txt
          )
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-supply-chain-${{ github.sha }}
          path: |
            release-evidence/app-debug.apk
            release-evidence/app-debug.spdx.json
            release-evidence/evidence.txt
            release-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  attest-provenance:
    name: APK Provenance and SBOM Attestation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact APK and SBOM from the read-only supply-chain job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p attestation-input attestation-evidence
          gh run download "${GITHUB_RUN_ID}"             -n "security-supply-chain-${GITHUB_SHA}"             -D attestation-input
          APK="$(find attestation-input -type f -name 'app-debug.apk' | head -1)"
          SBOM="$(find attestation-input -type f -name 'app-debug.spdx.json' | head -1)"
          MANIFEST="$(find attestation-input -type f -name 'SHA256SUMS.txt' | head -1)"
          test -f "$APK"
          test -f "$SBOM"
          test -f "$MANIFEST"
          cp "$APK" attestation-evidence/app-debug.apk
          cp "$SBOM" attestation-evidence/app-debug.spdx.json
          cp "$MANIFEST" attestation-evidence/SHA256SUMS.txt
          (
            cd attestation-evidence
            sha256sum -c SHA256SUMS.txt
          ) | tee attestation-evidence/manifest-verify.txt

      - name: Attest exact APK provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: attestation-evidence/app-debug.apk

      - name: Attest exact APK SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: attestation-evidence/app-debug.apk
          sbom-path: attestation-evidence/app-debug.spdx.json

      - name: Verify APK attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh attestation verify attestation-evidence/app-debug.apk --repo "$GITHUB_REPOSITORY" | tee attestation-evidence/attestation-verify.txt; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'ATTESTATION_VERIFY=PASS' | tee -a attestation-evidence/attestation-verify.txt

      - name: Upload attestation verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-attestation-${{ github.sha }}
          path: |
            attestation-evidence/SHA256SUMS.txt
            attestation-evidence/manifest-verify.txt
            attestation-evidence/attestation-verify.txt
          if-no-files-found: error
          retention-days: 30
