name: Security and Supply Chain

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  attestations: write

jobs:
  codeql:
    name: CodeQL Java-Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: java-kotlin
      - name: Build for CodeQL
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:java-kotlin

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run dependency review against the PR dependency diff
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

  supply-chain:
    name: APK SBOM Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - name: Build APK
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - name: Capture immutable evidence
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -f "$APK"
          mkdir -p release-evidence/apk-unpacked
          cp "$APK" release-evidence/app-debug.apk
          unzip -q release-evidence/app-debug.apk -d release-evidence/apk-unpacked
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "filename=$(basename "$APK")"
            echo "size=$(stat -c%s "$APK")"
            echo "sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "sha512=$(sha512sum "$APK" | awk '{print $1}')"
          } | tee release-evidence/evidence.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release-evidence/apk-unpacked
          format: spdx-json
          output-file: release-evidence/app-debug.spdx.json
          upload-artifact: false
      - name: Attest APK provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-evidence/app-debug.apk
      - name: Verify APK provenance attestation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh attestation verify release-evidence/app-debug.apk --repo "$GITHUB_REPOSITORY" | tee release-evidence/attestation-verify.txt; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'ATTESTATION_VERIFY=PASS' | tee -a release-evidence/attestation-verify.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-supply-chain-${{ github.sha }}
          path: |
            release-evidence/app-debug.apk
            release-evidence/app-debug.spdx.json
            release-evidence/evidence.txt
            release-evidence/attestation-verify.txt
          if-no-files-found: error
          retention-days: 30
