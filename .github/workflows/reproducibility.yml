name: Reproducible Build Evidence

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after || github.sha }}
          persist-credentials: false

      - name: Exact direct-head SHA guard
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test "${EXPECTED_SHA}" = "${actual}"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Verify pinned Gradle
        run: gradle --version

      - name: Compare two clean unsigned release builds
        run: |
          set -euo pipefail
          mkdir -p reproducibility
          gradle clean :app:assembleRelease --no-build-cache --rerun-tasks
          A=$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -1)
          test -f "$A"
          cp "$A" reproducibility/release-A-unsigned.apk
          gradle clean :app:assembleRelease --no-build-cache --rerun-tasks
          B=$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -1)
          test -f "$B"
          cp "$B" reproducibility/release-B-unsigned.apk
          sha256sum reproducibility/release-*-unsigned.apk | tee reproducibility/release-sha256.txt
          sha512sum reproducibility/release-*-unsigned.apk | tee reproducibility/release-sha512.txt
          if cmp -s reproducibility/release-A-unsigned.apk reproducibility/release-B-unsigned.apk; then
            echo 'UNSIGNED_RELEASE_REPRODUCIBLE=YES' | tee reproducibility/unsigned-result.txt
          else
            echo 'UNSIGNED_RELEASE_REPRODUCIBLE=NO' | tee reproducibility/unsigned-result.txt
          fi

      - name: Compare debug builds with independently generated debug signing identities
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          test -x "$APKSIGNER"
          rm -rf /tmp/debug-home-A /tmp/debug-home-B
          mkdir -p /tmp/debug-home-A /tmp/debug-home-B
          ANDROID_USER_HOME=/tmp/debug-home-A gradle clean :app:assembleDebug --no-build-cache --rerun-tasks
          cp app/build/outputs/apk/debug/app-debug.apk reproducibility/debug-A.apk
          "$APKSIGNER" verify --print-certs reproducibility/debug-A.apk > reproducibility/debug-A-cert.txt
          ANDROID_USER_HOME=/tmp/debug-home-B gradle clean :app:assembleDebug --no-build-cache --rerun-tasks
          cp app/build/outputs/apk/debug/app-debug.apk reproducibility/debug-B.apk
          "$APKSIGNER" verify --print-certs reproducibility/debug-B.apk > reproducibility/debug-B-cert.txt
          sha256sum reproducibility/debug-A.apk reproducibility/debug-B.apk | tee reproducibility/debug-sha256.txt
          sha512sum reproducibility/debug-A.apk reproducibility/debug-B.apk | tee reproducibility/debug-sha512.txt
          grep -E 'certificate SHA-256 digest:' reproducibility/debug-A-cert.txt | tee reproducibility/debug-cert-digests.txt
          grep -E 'certificate SHA-256 digest:' reproducibility/debug-B-cert.txt | tee -a reproducibility/debug-cert-digests.txt
          if cmp -s reproducibility/debug-A.apk reproducibility/debug-B.apk; then
            echo 'DEBUG_SIGNED_REPRODUCIBLE=YES' | tee reproducibility/debug-result.txt
          else
            echo 'DEBUG_SIGNED_REPRODUCIBLE=NO' | tee reproducibility/debug-result.txt
          fi

      - name: Sign identical release builds with one ephemeral non-production identity
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          test -x "$APKSIGNER"
          test -f reproducibility/release-A-unsigned.apk
          test -f reproducibility/release-B-unsigned.apk

          KS="$(mktemp /tmp/repro-signing.XXXXXX.jks)"
          rm -f "$KS"
          PW="$(openssl rand -hex 24)"
          cleanup() { rm -f "$KS"; unset PW; }
          trap cleanup EXIT

          keytool -genkeypair -noprompt \
            -keystore "$KS" \
            -storepass "$PW" \
            -keypass "$PW" \
            -alias repro \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname 'CN=NonProduction Reproducibility,O=Gpt-asistan,C=TR' \
            >/dev/null 2>&1

          "$APKSIGNER" sign \
            --ks "$KS" --ks-pass "pass:$PW" --key-pass "pass:$PW" \
            --out reproducibility/release-A-signed.apk \
            reproducibility/release-A-unsigned.apk
          "$APKSIGNER" sign \
            --ks "$KS" --ks-pass "pass:$PW" --key-pass "pass:$PW" \
            --out reproducibility/release-B-signed.apk \
            reproducibility/release-B-unsigned.apk

          "$APKSIGNER" verify --print-certs reproducibility/release-A-signed.apk > reproducibility/release-A-signed-cert.txt
          "$APKSIGNER" verify --print-certs reproducibility/release-B-signed.apk > reproducibility/release-B-signed-cert.txt

          sha256sum reproducibility/release-A-unsigned.apk reproducibility/release-B-unsigned.apk \
            | tee reproducibility/unsigned-release-sha256.txt
          sha256sum reproducibility/release-A-signed.apk reproducibility/release-B-signed.apk \
            | tee reproducibility/signed-release-sha256.txt

          cert_a="$(grep -m1 -E 'certificate SHA-256 digest:' reproducibility/release-A-signed-cert.txt | sed 's/.*: //')"
          cert_b="$(grep -m1 -E 'certificate SHA-256 digest:' reproducibility/release-B-signed-cert.txt | sed 's/.*: //')"
          echo "CERT_SHA_A=${cert_a}" | tee reproducibility/signed-cert-digests.txt
          echo "CERT_SHA_B=${cert_b}" | tee -a reproducibility/signed-cert-digests.txt
          test -n "$cert_a"
          test "$cert_a" = "$cert_b"

          if cmp -s reproducibility/release-A-signed.apk reproducibility/release-B-signed.apk; then
            echo 'SIGNED_RELEASE_REPRODUCIBLE=YES' | tee reproducibility/signed-result.txt
          else
            echo 'SIGNED_RELEASE_REPRODUCIBLE=NO' | tee reproducibility/signed-result.txt
          fi

      - name: Classify reproducibility
        run: |
          set -euo pipefail
          unsigned=$(cut -d= -f2 reproducibility/unsigned-result.txt)
          debug=$(cut -d= -f2 reproducibility/debug-result.txt)
          signed=$(cut -d= -f2 reproducibility/signed-result.txt)
          cert_unique=$(sed 's/.*: //' reproducibility/debug-cert-digests.txt | sort -u | wc -l)
          if [ "$unsigned" = YES ] && [ "$debug" = NO ] && [ "$cert_unique" -ge 2 ]; then
            echo 'DEBUG_ROOT_CAUSE=SIGNING_IDENTITY_VARIANCE' | tee reproducibility/classification.txt
          elif [ "$unsigned" = NO ]; then
            echo 'DEBUG_ROOT_CAUSE=UNSIGNED_BUILD_NONDETERMINISM_REQUIRES_ZIP_METADATA_ANALYSIS' | tee reproducibility/classification.txt
          else
            echo 'DEBUG_ROOT_CAUSE=OTHER_OR_NOT_REPRODUCED' | tee reproducibility/classification.txt
          fi
          if [ "$unsigned" = YES ] && [ "$signed" = YES ]; then
            echo 'SIGNED_REPRODUCIBILITY=VERIFIED' | tee -a reproducibility/classification.txt
          else
            echo 'SIGNED_REPRODUCIBILITY=PARTIAL' | tee -a reproducibility/classification.txt
          fi
          {
            echo "HEAD_SHA=${EXPECTED_SHA}"
            echo "EVENT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            cat reproducibility/unsigned-result.txt
            cat reproducibility/debug-result.txt
            cat reproducibility/signed-result.txt
            cat reproducibility/classification.txt
          } | tee reproducibility/summary.txt
          test "$unsigned" = YES
          test "$signed" = YES

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reproducibility-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: reproducibility/**
          if-no-files-found: error
          retention-days: 30
