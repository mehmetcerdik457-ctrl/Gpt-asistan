name: KRAL Branch Task Queue - Fixed CI
on:
  push:
    branches:
      - integration/genesis8-copilot-20261024
    paths:
      - server/task_ticket.json
      - .github/workflows/kral-branch-pilot.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: kral-fixed-queue-${{ github.repository }}
  cancel-in-progress: false
jobs:
  fixed-source-ci:
    if: github.repository == 'mehmetcerdik457-ctrl/Gpt-asistan' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run all fixed tests, never issue commands
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s server/tests -v 2>&1 | tee kral-checks.log
      - name: Post verified result to owner issue in ticket
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m server.github_push_pilot
