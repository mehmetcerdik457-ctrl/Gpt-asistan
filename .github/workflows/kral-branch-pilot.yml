name: KRAL Branch Pilot - Owner Issue 40
on:
  push:
    branches:
      - integration/cihat-github-task-bridge-20261021
    paths:
      - .github/workflows/kral-branch-pilot.yml
permissions:
  contents: read
  issues: write
jobs:
  fixed-source-ci:
    if: github.repository == 'mehmetcerdik457-ctrl/Gpt-asistan' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run all fixed tests (no task-text execution)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s server/tests -v 2>&1 | tee kral-checks.log
      - name: Post verified result to owner issue 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m server.github_push_pilot
