name: Advanced APK Forensic Toolchain

on:
  push:
    branches: [main, copilot-agent-upgrade-20260917]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advanced-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare evidence directory
        run: mkdir -p advanced-evidence

      - name: Capstone real execution
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet capstone==5.0.9
          python3 - <<'PY' > advanced-evidence/capstone.log 2>&1
          import capstone
          print('CAPSTONE_VERSION=' + capstone.__version__)
          md = capstone.Cs(capstone.CS_ARCH_ARM64, capstone.CS_MODE_ARM)
          ins = list(md.disasm(bytes.fromhex('200080d2c0035fd6'), 0x1000))
          assert len(ins) == 2
          for i in ins: print(hex(i.address), i.mnemonic, i.op_str)
          PY
          echo 'TOOL=Capstone TARGET=SYNTHETIC_ARM64_BYTES COMMAND=python_capstone_disasm RESULT=RC_0' | tee advanced-evidence/capstone.status

      - name: Ghidra headless install and real ELF analysis
        run: |
          set -euo pipefail
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip"
          curl -fsSL "$url" -o /tmp/ghidra.zip
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  /tmp/ghidra.zip' | sha256sum -c -
          rm -rf /tmp/ghidra-unpack /tmp/ghidra-project
          mkdir -p /tmp/ghidra-unpack /tmp/ghidra-project
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra-unpack
          GH=$(find /tmp/ghidra-unpack -maxdepth 4 -type f -path '*/support/analyzeHeadless' -print -quit)
          test -n "$GH" && test -x "$GH"
          echo "GHIDRA_HEADLESS=$GH" > advanced-evidence/ghidra.log
          "$GH" /tmp/ghidra-project Gate0ELF -import /bin/ls -deleteProject >> advanced-evidence/ghidra.log 2>&1
          echo 'TOOL=Ghidra TARGET=/bin/ls COMMAND=analyzeHeadless_import RESULT=RC_0' | tee advanced-evidence/ghidra.status

      - name: Build radare2 and r2flutter then run bundled Dart AOT sample
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git make pkg-config meson ninja-build python3-pip >/tmp/r2-apt.log 2>&1
          rm -rf /tmp/radare2 /tmp/r2flutter
          git init -q /tmp/radare2
          git -C /tmp/radare2 remote add origin https://github.com/radareorg/radare2.git
          git -C /tmp/radare2 fetch --depth 1 origin 39b18895dc5fd85177959d4af90434e975866d56 > advanced-evidence/radare2-clone.log 2>&1
          git -C /tmp/radare2 checkout --detach FETCH_HEAD >> advanced-evidence/radare2-clone.log 2>&1
          test "$(git -C /tmp/radare2 rev-parse HEAD)" = "39b18895dc5fd85177959d4af90434e975866d56"
          (cd /tmp/radare2 && sys/install.sh) > advanced-evidence/radare2-build.log 2>&1
          r2 -v | tee advanced-evidence/radare2-version.log
          echo 'TOOL=radare2 TARGET=VERSION_PROBE COMMAND=r2_-v RESULT=RC_0' | tee advanced-evidence/radare2.status

          git init -q /tmp/r2flutter
          git -C /tmp/r2flutter remote add origin https://github.com/radareorg/r2flutter.git
          git -C /tmp/r2flutter fetch --depth 1 origin 67935055e5a113ede14b4e410264fc8ee62e0c37 > advanced-evidence/r2flutter-clone.log 2>&1
          git -C /tmp/r2flutter checkout --detach FETCH_HEAD >> advanced-evidence/r2flutter-clone.log 2>&1
          test "$(git -C /tmp/r2flutter rev-parse HEAD)" = "67935055e5a113ede14b4e410264fc8ee62e0c37"
          (cd /tmp/r2flutter && make) > advanced-evidence/r2flutter-build.log 2>&1
          /tmp/r2flutter/bin/r2flutter -V | tee advanced-evidence/r2flutter-version.log
          sample=$(find /tmp/r2flutter/test/bins -type f -name 'libapp.so' -print -quit 2>/dev/null)
          test -n "$sample"
          /tmp/r2flutter/bin/r2flutter -HH -l 16 "$sample" > advanced-evidence/r2flutter-sample.log 2>&1
          echo "TOOL=r2flutter SAMPLE_TARGET=$sample COMMAND='r2flutter -HH -l 16' RESULT=RC_0" | tee advanced-evidence/r2flutter.status
          /tmp/r2flutter/bin/r2flutter -D 3.10.7 -H "$sample" > advanced-evidence/r2flutter-dart3107-profile.log 2>&1
          echo "DART_3_10_7_PROFILE_CAPABILITY=VERIFIED SAMPLE_TARGET=$sample RESULT=RC_0" | tee -a advanced-evidence/r2flutter.status
          echo 'TARGET_CHATBOT_OBJECTPOOL_XREF=NOT_TESTED' | tee -a advanced-evidence/r2flutter.status

      - name: Blutter capability probe
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq cmake ninja-build pkg-config libicu-dev libcapstone-dev >/dev/null 2>&1
          python3 -m pip install --user --quiet requests==2.34.2 pyelftools==0.33
          rm -rf /tmp/blutter
          git init -q /tmp/blutter
          git -C /tmp/blutter remote add origin https://github.com/worawit/blutter.git
          git -C /tmp/blutter fetch --depth 1 origin 4a60ac648bf448c5a7596437243bcd0b9376fdf0 > advanced-evidence/blutter-clone.log 2>&1
          git -C /tmp/blutter checkout --detach FETCH_HEAD >> advanced-evidence/blutter-clone.log 2>&1
          test "$(git -C /tmp/blutter rev-parse HEAD)" = "4a60ac648bf448c5a7596437243bcd0b9376fdf0"
          python3 /tmp/blutter/blutter.py --help > advanced-evidence/blutter-help.log 2>&1
          echo "BLUTTER_HEAD=$(git -C /tmp/blutter rev-parse HEAD)" | tee advanced-evidence/blutter.status
          echo 'TOOL=Blutter TARGET=HELP_CAPABILITY COMMAND=blutter.py_--help RESULT=RC_0' | tee -a advanced-evidence/blutter.status

      - name: Upload advanced forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: advanced-forensics-${{ github.sha }}
          path: advanced-evidence/**
          if-no-files-found: error
          retention-days: 30
