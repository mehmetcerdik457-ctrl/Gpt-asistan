name: Control Plane Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-plane-validation:
    name: Validate Control Plane Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate control plane
        run: |
          python3 control-plane/validate.py | tee /tmp/control-plane-validation.json

      - name: Generate evidence
        run: |
          mkdir -p evidence
          cp /tmp/control-plane-validation.json evidence/control-plane-validation.json
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
          } > evidence/run-metadata.txt
          sha256sum evidence/control-plane-validation.json evidence/run-metadata.txt > evidence/SHA256SUMS

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-validation-evidence
          path: |
            evidence/control-plane-validation.json
            evidence/run-metadata.txt
            evidence/SHA256SUMS
          if-no-files-found: error
