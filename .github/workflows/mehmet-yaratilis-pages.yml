name: Deploy MEHMET YARATILIS PWA to GitHub Pages

on:
  push:
    branches:
      - mehmet-yaratilis-pwa
    paths:
      - 'mehmet-yaratilis-pwa/**'
      - '.github/workflows/mehmet-yaratilis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mehmet-yaratilis-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./mehmet-yaratilis-pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
