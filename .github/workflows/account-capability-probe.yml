name: Account Capability Probe

on:
  push:
    branches:
      - copilot-agent-upgrade-20260917
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Exact direct-head SHA guard
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_GIT_SHA=${actual}"
          test "${EXPECTED_SHA}" = "${actual}"

      - name: Probe Codespaces create and real boot path
        if: github.event_name == 'push' && github.event.head_commit.message == 'Probe Codespaces and Copilot account capabilities'
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -nc --argjson repository_id "${{ github.repository_id }}" --arg ref "${GITHUB_REF_NAME}" '{repository_id:$repository_id,ref:$ref}')"
          code="$(curl -sS -o /tmp/codespace-create.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/user/codespaces \
            -d "$body")"
          echo "CODESPACE_CREATE_HTTP=${code}"
          jq -r 'if .message then "CODESPACE_CREATE_MESSAGE=" + .message else empty end' /tmp/codespace-create.json || true

          if [ "$code" = 201 ] || [ "$code" = 202 ]; then
            name="$(jq -r '.name // empty' /tmp/codespace-create.json)"
            test -n "$name"
            echo "CODESPACE_NAME=${name}"
            state=""
            for _ in $(seq 1 60); do
              get_code="$(curl -sS -o /tmp/codespace-state.json -w '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/user/codespaces/${name}")"
              echo "CODESPACE_GET_HTTP=${get_code}"
              if [ "$get_code" = 200 ]; then
                state="$(jq -r '.state // empty' /tmp/codespace-state.json)"
                echo "CODESPACE_STATE=${state}"
                case "$state" in
                  Available|Shutdown|Unavailable|Failed) break ;;
                esac
              fi
              sleep 10
            done
            if [ "$state" = Available ]; then
              set +e
              gh codespace ssh -c "$name" -- 'cd /workspaces/Gpt-asistan && ./.devcontainer/verify-toolchain.sh'
              ssh_rc=$?
              set -e
              echo "CODESPACE_POSTCREATE_VERIFY_RC=${ssh_rc}"
            else
              echo "CODESPACE_POSTCREATE_VERIFY_RC=NOT_RUN_STATE_${state:-UNKNOWN}"
            fi
            delete_code="$(curl -sS -o /tmp/codespace-delete.json -w '%{http_code}' -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/user/codespaces/${name}")"
            echo "CODESPACE_CLEANUP_HTTP=${delete_code}"
          else
            echo 'CODESPACE_REAL_BOOT=USER_ACTION_REQUIRED_TOKEN_CLASS_OR_PERMISSION'
          fi

      - name: Probe Copilot repository and user billing APIs
        if: github.event_name == 'push' && github.event.head_commit.message == 'Probe Codespaces and Copilot account capabilities'
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; url="$2"; out="/tmp/${label}.json"
            code="$(curl -sS -o "$out" -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$url")"
            echo "${label}_HTTP=${code}"
            jq -r 'if .message then "API_MESSAGE=" + .message else empty end' "$out" || true
          }
          probe COPILOT_CLOUD_AGENT_CONFIGURATION "https://api.github.com/repos/${GITHUB_REPOSITORY}/copilot/cloud-agent/configuration"
          probe USER_PREMIUM_REQUEST_USAGE "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/settings/billing/premium_request/usage"
          probe USER_AI_CREDIT_USAGE "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/settings/billing/ai_credit/usage"

      - name: Attempt Issue 4 custom-agent assignment through documented REST shape
        if: github.event_name == 'push' && github.event.head_commit.message == 'Probe Codespaces and Copilot account capabilities'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" '{assignees:["copilot-swe-agent[bot]"],agent_assignment:{target_repo:$repo,base_branch:$branch,custom_instructions:"Run the read-only Gate 0 forensic execution test exactly as the issue requests. Do not modify, repack, resign, or overwrite APK evidence.",custom_agent:"APK Forensic",model:""}}')"
          code="$(curl -sS -o /tmp/copilot-assignment.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/4/assignees" \
            -d "$payload")"
          echo "CUSTOM_AGENT_ASSIGNMENT_HTTP=${code}"
          jq -r 'if .message then "CUSTOM_AGENT_ASSIGNMENT_MESSAGE=" + .message else empty end' /tmp/copilot-assignment.json || true
          if [ "$code" = 200 ] || [ "$code" = 201 ]; then
            echo 'CUSTOM_AGENT_ASSIGNMENT_ACCEPTED=YES'
            jq -r '.assignees[]?.login | "ASSIGNEE=" + .' /tmp/copilot-assignment.json || true
          else
            echo 'CUSTOM_AGENT_ASSIGNMENT_ACCEPTED=NO'
          fi
