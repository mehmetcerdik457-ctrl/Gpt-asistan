name: Gate 0 Fallback Verification

on:
  push:
    branches: [copilot-agent-upgrade-20260917]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build real APK again
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            printf '#!/bin/sh\nexec /tmp/gradle-8.7/bin/gradle "$@"\n' > gradlew
            chmod +x gradlew
          fi
          ./gradlew :app:assembleDebug
      - name: Verify JADX fallback and Blutter installation
        run: |
          set +e
          mkdir -p fallback-evidence /tmp/jadx
          url=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -1)
          curl -fsSL "$url" -o /tmp/jadx.zip && unzip -q /tmp/jadx.zip -d /tmp/jadx
          J=/tmp/jadx/bin/jadx
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$J" --version | tee fallback-evidence/jadx-version.txt
          "$J" --single-class com.example.gptasistan.MainActivity --single-class-output fallback-evidence/MainActivity.java "$APK" > fallback-evidence/jadx-single.log 2>&1
          jrc=$?
          echo "JADX_SINGLE_CLASS_RC=$jrc" | tee fallback-evidence/fallback-report.txt
          test -s fallback-evidence/MainActivity.java && echo "JADX_OUTPUT_BYTES=$(stat -c%s fallback-evidence/MainActivity.java)" | tee -a fallback-evidence/fallback-report.txt

          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null 2>&1
          python3 -m pip install --user --quiet requests pyelftools
          git clone --depth 1 https://github.com/worawit/blutter.git /tmp/blutter > fallback-evidence/blutter-clone.log 2>&1
          brc=$?
          echo "BLUTTER_CLONE_RC=$brc" | tee -a fallback-evidence/fallback-report.txt
          if [ -f /tmp/blutter/blutter.py ]; then
            echo "BLUTTER_HEAD=$(git -C /tmp/blutter rev-parse HEAD)" | tee -a fallback-evidence/fallback-report.txt
            python3 /tmp/blutter/blutter.py --help > fallback-evidence/blutter-help.log 2>&1
            hrc=$?
            echo "BLUTTER_HELP_RC=$hrc" | tee -a fallback-evidence/fallback-report.txt
          fi
          if unzip -l "$APK" | grep -Eq 'libapp\.so|libflutter\.so|flutter_assets'; then
            echo "FLUTTER_AOT=PRESENT" | tee -a fallback-evidence/fallback-report.txt
          else
            echo "FLUTTER_AOT=ABSENT_TARGET_NOT_APPLICABLE" | tee -a fallback-evidence/fallback-report.txt
          fi
      - name: Attempt Copilot custom-agent assignment through official REST shape
        run: |
          set +e
          cat > /tmp/assign.json <<'JSON'
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "mehmetcerdik457-ctrl/Gpt-asistan",
              "base_branch": "copilot-agent-upgrade-20260917",
              "custom_instructions": "Run the APK Forensic Analyst custom agent. Use the existing Gate 0 workflow evidence and preserve APK bytes.",
              "custom_agent": "apk-forensic",
              "model": ""
            }
          }
          JSON
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/mehmetcerdik457-ctrl/Gpt-asistan/issues/4/assignees \
            --input /tmp/assign.json > fallback-evidence/copilot-assignment.json 2> fallback-evidence/copilot-assignment.err
          rc=$?
          echo "COPILOT_AGENT_ASSIGNMENT_RC=$rc" | tee -a fallback-evidence/fallback-report.txt
          cat fallback-evidence/copilot-assignment.json || true
          cat fallback-evidence/copilot-assignment.err || true
          exit 0
      - name: Upload fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate0-fallback-evidence
          path: fallback-evidence/**
