name: Cancel Stale Branch Runs

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SHA: ${{ github.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel older runs from obsolete heads of this branch and PR
        shell: bash
        run: |
          set -euo pipefail

          live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}" --jq '.commit.sha')"
          current_created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" --jq '.created_at')"
          owner="${GITHUB_REPOSITORY%%/*}"
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${GITHUB_REF_NAME}&per_page=1" --jq '.[0].number // empty')"

          echo "CURRENT_SHA=${CURRENT_SHA}"
          echo "LIVE_BRANCH_SHA=${live_sha}"
          echo "CURRENT_RUN_CREATED_AT=${current_created_at}"
          echo "CURRENT_PR=${current_pr:-NONE}"

          if [ "${live_sha}" != "${CURRENT_SHA}" ]; then
            echo "STALE_CLEANER_NOOP=YES REASON=BRANCH_ADVANCED"
            exit 0
          fi

          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&per_page=100")"
          mapfile -t stale_ids < <(
            jq -r \
              --arg sha "${CURRENT_SHA}" \
              --arg run "${CURRENT_RUN_ID}" \
              --arg created "${current_created_at}" \
              --arg pr "${current_pr}" \
              '.workflow_runs[]
               | select(.head_sha != $sha)
               | select(.created_at < $created)
               | select((.status == "queued") or (.status == "in_progress") or (.status == "pending"))
               | select((.id | tostring) != $run)
               | select(
                   (.event == "push")
                   or
                   (.event == "pull_request" and $pr != "" and any(.pull_requests[]?; (.number | tostring) == $pr))
                 )
               | .id' <<<"${payload}"
          )

          handled=0
          for id in "${stale_ids[@]:-}"; do
            [ -n "${id}" ] || continue

            # Re-check live branch identity immediately before every destructive action.
            live_now="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}" --jq '.commit.sha')"
            if [ "${live_now}" != "${CURRENT_SHA}" ]; then
              echo "ABORT_CLEANUP=YES REASON=BRANCH_ADVANCED LIVE_SHA=${live_now}"
              exit 0
            fi

            target="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            target_sha="$(jq -r '.head_sha' <<<"${target}")"
            target_event="$(jq -r '.event' <<<"${target}")"
            target_created="$(jq -r '.created_at' <<<"${target}")"
            target_pr="$(jq -r '.pull_requests[0].number // empty' <<<"${target}")"

            eligible=false
            if [ "${target_event}" = "push" ]; then
              eligible=true
            elif [ "${target_event}" = "pull_request" ] && [ -n "${current_pr}" ] && [ "${target_pr}" = "${current_pr}" ]; then
              eligible=true
            fi

            if [ "${eligible}" != "true" ] || [ "${target_sha}" = "${CURRENT_SHA}" ] || [[ ! "${target_created}" < "${current_created_at}" ]]; then
              echo "SKIP_RUN_ID=${id} REASON=SAFETY_GUARD"
              continue
            fi

            code="$(curl -sS -o "/tmp/cancel-${id}.json" -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel")"
            echo "CANCEL_RUN_ID=${id} EVENT=${target_event} HTTP=${code}"
            case "${code}" in
              202|409) handled=$((handled + 1)) ;;
              *) cat "/tmp/cancel-${id}.json" >&2 || true; exit 1 ;;
            esac
          done

          echo "STALE_RUNS_MATCHED=${#stale_ids[@]}"
          echo "STALE_RUNS_HANDLED=${handled}"
          echo "STALE_RUN_CLEANUP=PASS"
