name: Phone Agent Emulator Validation

on:
  push:
    branches:
      - phone-agent/runtime-v1
      - owner/stable-companion-v1
      - owner/full-brain-v1-20260924

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phone-agent-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          test "${ACTUAL}" = "${GITHUB_SHA}"
          printf "expected_sha=%s\nactual_sha=%s\n" "${GITHUB_SHA}" "${ACTUAL}"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Unit test and build exact-head APK
        run: |
          gradle :app:testDebugUnitTest
          gradle :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute phone-agent runtime in Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/phone_agent_emulator_verify.sh

      - name: Verify emulator evidence
        shell: bash
        run: |
          test -s emulator-evidence/phone-agent-emulator-evidence.json
          grep -q '"status": "EMULATOR_PHONE_AGENT_RUNTIME_PASS"' emulator-evidence/phone-agent-emulator-evidence.json
          grep -q "\"git_head\": \"${GITHUB_SHA}\"" emulator-evidence/phone-agent-emulator-evidence.json
          (cd emulator-evidence && sha256sum -c SHA256SUMS)

      - name: Upload emulator runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: phone-agent-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn
