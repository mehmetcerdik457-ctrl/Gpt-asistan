name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-release-signing-20261124

permissions:
  contents: read

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate signing secrets and decode keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is empty: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          test -s app/release-keystore.jks
          chmod 600 app/release-keystore.jks

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ./gradlew ]]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
            unzip -q gradle.zip -d gradle-8.7
            printf '%s\n' '#!/usr/bin/env sh' 'exec "$(pwd)/gradle-8.7/gradle-8.7/bin/gradle" "$@"' > gradlew
            chmod +x gradlew
          fi

      - name: Build signed Release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          jarsigner -verify "$AAB"

      - name: Record artifact SHA-256 and signing certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -n "$AAB"
          echo "=== SHA-256 ==="
          sha256sum "$APK" "$AAB"
          echo "=== APK signing certificate ==="
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs --verbose "$APK"
          echo "=== AAB signing certificate ==="
          keytool -printcert -jarfile "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release-keystore.jks
